name: qa

# QA E2E — Copero
# MGC-302: scaffold Playwright headless contra bundle Expo web.
# No corre Maestro mobile (hardware persistente — QA agent owns ZY22G728HN).
# Trigger: PR contra main + push a main + manual dispatch.
# Secrets inyectados por DevOps vía Infisical — placeholders abajo.
# MGC-308: Playwright corre en el runner Linux dedicado `copero-qa`
# para evitar que suites largas compitan con el pool `copero-ci`.
# Runner: VPS mgcstudios-01 (labels `copero-qa`, `Linux`).

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/**'
      - '.github/workflows/qa.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA explicito para grupo de concurrency unico (evita cancel-in-progress con push a main)"
        required: false
        type: string

# MGC-380: serializar runs para no saturar el runner self-hosted copero-ci
# (un solo runner Linux en VPS mgcstudios-01). cancel-in-progress:true
# cancela runs previos cuando llega uno nuevo (PR actualizado).
# MGC-600: workflow_dispatch con input `sha` recibe grupo unico (qa-copero-<sha>)
# independiente del push a main (qa-copero-refs/heads/main). Permite QA smoke sobre
# SHA arbitrario sin que un merge subsecuente a main lo cancele.
concurrency:
  group: qa-copero-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && inputs.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-web:
    name: Playwright (web, headless)
    # MGC-2092: enrutado al runner-02 (Mac mini, ARM64) via label `copero-heavy`.
    # runner-01 (VPS Linux) queda reservado para ci.yml.
    runs-on: [self-hosted, copero-heavy]
    # MGC-380: 15min insuficiente; bump a 30min.
    # MGC-444: 30min insufficient cuando el runner self-hosted tiene
    # errores intermitentes de red al subir logs a
    # results-receiver.actions.githubusercontent.com (ResponseEnded).
    # El backoff/retry de upload come el budget y la suite no termina.
    # 60min cubre npm ci ~8min + tests con reintentos + margen para
    # reintentos de upload de logs.
    # MGC-444 (re-ejecución): 60min sigue insuficiente con simulador-carrera
    # specs (mgc452/461/462) que disparan retries=2 sobre el runner self-hosted
    # con swap-thrash. Run 32678661082 disparó ~46min, cayó por timeout al
    # terminar retries del último spec visual. 90min cubre npm ci + 5 specs
    # pesados con 2 retries + margen para upload de logs a GitHub.
    # MGC-346: bajar a 60min tras sumar runner-02 (macOS) al pool. Con 2 runners
    # disponibles, un job colgado de 60min inmoviliza un solo runner en vez del único.
    timeout-minutes: 60
    env:
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # MGC-359: cache deshabilitado en runner self-hosted.
          # `cache: 'npm'` hacía subir ~800MB de node_modules al servicio de cache
          # de GitHub y quedaba a 0.0 MB/s hasta timeout 95s en copero-ci.
          # `cache: 'false'` (string) no es válido en actions/setup-node@v4 — falla
          # con "Caching for 'false' is not supported". Solución correcta: omitir
          # el input `cache` por completo; el default vacío no genera upload.
          # Reuso entre jobs es bajo (runner local persistente) — aceptable.

      - name: Reservar puerto efímero para E2E
        # El runner self-hosted puede tener残余 http.server en :8081.
        # Reservamos un puerto alto aleatorio y lo exportamos a Playwright.
        id: e2e-port
        run: |
          PORT=$((18000 + RANDOM % 1000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "[qa] puerto E2E reservado: $PORT"

      - name: Liberar puerto E2E antes de Playwright
        # MGC-459: limpieza defensiva. El runner self-hosted retiene
        # python3 -m http.server y chromium zombis entre runs (cancel-in-progress
        # mata el job GH pero no los procesos hijos). Sin esto, el dev server
        # queda no-responsive tras 5-6 specs pesados (visual+axe+keyboard)
        # y los page.goto finales timeoutean a 30s.
        # Matamos: (a) cualquier servidor en el nuevo puerto, (b) cualquier
        # http.server/python3 sirviendo en el rango E2E, (c) chromium headless
        # huérfano. Mantenemos un margen de 2s para que el kernel libere el socket.
        run: |
          echo "[qa] cleanup defensivo antes de reservar ${{ steps.e2e-port.outputs.port }}"
          if command -v lsof >/dev/null 2>&1; then
            PIDS=$(lsof -ti:${{ steps.e2e-port.outputs.port }} 2>/dev/null || true)
            if [ -n "$PIDS" ]; then
              echo "[qa] matando PIDs en puerto nuevo ${{ steps.e2e-port.outputs.port }} -> $PIDS"
              kill -9 $PIDS 2>/dev/null || true
            fi
            # Rango efímero completo 18000-18999 (definido arriba).
            STALE=$(lsof -ti:18000-18999 2>/dev/null || true)
            if [ -n "$STALE" ]; then
              echo "[qa] matando servidores stale en 18000-18999 -> $STALE"
              kill -9 $STALE 2>/dev/null || true
            fi
          fi
          # Chromium headless huérfano (sin puerto asociado tras cancel-in-progress).
          if command -v pgrep >/dev/null 2>&1; then
            CHROME=$(pgrep -f 'chrome.*--headless' 2>/dev/null || true)
            if [ -n "$CHROME" ]; then
              echo "[qa] matando chromium headless huérfano -> $CHROME"
              kill -9 $CHROME 2>/dev/null || true
            fi
          fi
          sleep 2
          echo "[qa] cleanup completo"

      - name: Install deps
        run: npm ci --include=dev

      - name: Install Playwright Chromium
        # Sin --with-deps: el runner ya tiene los apt packages instalados
        # via bootstrap-copero-runner.sh (MGC-308).
        run: npx playwright install chromium

      - name: Build Expo web bundle
        run: npm run build:web
        env:
          # Placeholders — DevOps inyecta valores reales vía Infisical.
          # Si vacío: el build igual corre; algunos SDKs nativos pueden fallar en web.
          INFISICAL_EXPO_PUBLIC_ADMOB_APP_ID: ${{ secrets.INFISICAL_EXPO_PUBLIC_ADMOB_APP_ID || '' }}
          INFISICAL_EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.INFISICAL_EXPO_PUBLIC_FIREBASE_API_KEY || '' }}

      - name: Run Playwright
        # MGC-598 / MGC-460: simulador-carrera strict-mode identity-screen
        # resuelto por MGC-429 / PR #180 (wrapper único en
        # app/simulador-carrera/identity.tsx:33). El spec pasa con
        # --workers=1 --retries=0 sin .first() defensivo — validado PASS
        # local 3/3 en 11.7s. Solo queda invertida la spec a11y-keyboard
        # (MGC-505 keyboard, fix vive en ticket aparte).
        run: npm run test:e2e:web -- --grep-invert "Copero — keyboard-only happy path \(web\) — MGC-505"
        env:
          CI: 'true'
          EXPO_WEB_BASE_URL: http://127.0.0.1:${{ steps.e2e-port.outputs.port }}
          EXPO_WEB_PORT: ${{ steps.e2e-port.outputs.port }}
          INFISICAL_EXPO_PUBLIC_ADMOB_APP_ID: ${{ secrets.INFISICAL_EXPO_PUBLIC_ADMOB_APP_ID || '' }}
          INFISICAL_EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.INFISICAL_EXPO_PUBLIC_FIREBASE_API_KEY || '' }}

      # MGC-293 AC: "Reporte de cobertura subido como artefacto".
      # Subimos SIEMPRE (no solo on-failure) para tener histórico de runs
      # verdes y screenshots de baseline. retention 14d.
      # MGC-377: e2e/playwright.config.ts ahora ancla outputDir y el HTML
      # reporter a resolve(__dirname, '.results'|'playwright-report'), que
      # desde el runner (cwd = repo root tras actions/checkout) caen en
      # e2e/.results y e2e/playwright-report. Antes el path del HTML era
      # 'playwright-report' (raíz), pero Playwright con --config hace
      # process.chdir(e2e/), así que nunca encontraba el directorio.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
