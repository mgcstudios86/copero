# eas.yml — Copero (MGC-290, MGC-379, MGC-1206, MGC-1263, MGC-1374)
#
# Política vigente desde MGC-1263 (opción C CEO MGC-1150):
#   - APK QA **NO** se produce en CI. La job android se transformó en smoke
#     (lint + typecheck + config validate). El artefacto sale de
#     `eas build --local` ejecutado en el Mac por mobile-developer con el SHA
#     pineado (ver CLAUDE.md §"Política de APK QA").
#   - El runner-01 (VPS mgcstudios-01, 954 MB / 2 vCPU) no sostiene builds
#     Android: 30 runs históricos = 0 success / 26 cancelled por supersede.
#     Por eso **ningún job de este workflow** corre `eas build` sobre Linux.
#   - iOS sigue construyendo en el runner-02 (Mac mini ARM64, label
#     `copero-ci, macOS`) con profile `preview-ios-sim` — único job que sí
#     produce artefacto (`eas build --local --platform ios`).
#
# Cambios MGC-1263:
#   1. `preview-android` → `smoke-android`. Sin `eas build`, sin artefacto,
#      sin provenance gate, sin `qa-ac7-force-stop`.
#   2. Trigger `push`/`pull_request` ya no encola build de Android — solo
#      smoke barato (~2 min).
#   3. `workflow_dispatch` removido: no hay build Android que disparar
#      manualmente; el APK se hace en Mac local.

name: eas-preview (copero)

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'perf/**'
      - 'docs/**'
      - 'test/**'
      - 'build/**'
      # NOTE: 'main' queda fuera; los merges a main disparan ci.yml.
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  pull_request:
    branches:
      - 'feat/**'
      - 'fix/**'

concurrency:
  group: eas-preview-copero-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: detect changed paths
    runs-on: [self-hosted, copero-heavy]
    # MGC-1374: el runner-01 es single-job self-hosted; un checkout colgado o un
    # paths-filter trabado bloquea todo el FIFO detrás. 10 min es generoso para
    # checkout + paths-filter sobre el árbol de Copero.
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'android/**'
              - 'app.json'
              - 'package.json'
              - 'eas.json'
            ios:
              - 'ios/**'
              - 'app.json'
              - 'package.json'
              - 'eas.json'
            core:
              - 'App.tsx'
              - 'src/**'
              - 'app/**'
              - 'index.ts'
              - '*.ts'
              - '*.tsx'
              - 'app.json'
              - 'package.json'
              - 'eas.json'
              - 'tsconfig*.json'

  smoke-android:
    # MGC-1263: este job NO produce APK. Es solo el smoke que antes convivía
    # dentro de `preview-android` (lint + typecheck + config validate).
    # El APK viene de `eas --local` en Mac (mobile-developer), ver CLAUDE.md.
    # MGC-1374: timeout explícito. Históricamente un `npm ci` se colgaba al
    # final del job y bloqueaba el runner horas (run 33572157012 + 6 más FIFO).
    name: smoke android (lint + typecheck + config validate)
    runs-on: [self-hosted, copero-heavy]
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar eas.json (JSON parse + perfiles requeridos)
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            const profiles = Object.keys(cfg.build || {});
            for (const p of ['preview', 'preview-ios-sim', 'production']) {
              if (!profiles.includes(p)) {
                console.error('ERROR: eas.json falta perfil requerido: ' + p);
                process.exit(1);
              }
            }
            if (!cfg.cli || cfg.cli.appVersionSource !== 'remote') {
              console.error('ERROR: eas.json cli.appVersionSource debe ser \"remote\"');
              process.exit(1);
            }
            console.log('[smoke] eas.json OK — perfiles: ' + profiles.join(', '));
          "
      - name: Validar app.config.js (load + extraer projectId)
        run: |
          node -e "
            const cfg = require('./app.config.js')({});
            if (!cfg.extra || !cfg.extra.eas || !cfg.extra.eas.projectId) {
              console.error('ERROR: app.config.js extra.eas.projectId ausente');
              process.exit(1);
            }
            if (!cfg.android || !cfg.android.package) {
              console.error('ERROR: app.config.js android.package ausente');
              process.exit(1);
            }
            if (!cfg.ios || !cfg.ios.bundleIdentifier) {
              console.error('ERROR: app.config.js ios.bundleIdentifier ausente');
              process.exit(1);
            }
            console.log('[smoke] app.config.js OK — projectId=' + cfg.extra.eas.projectId);
          "
      - name: Prohibir triggers Android automáticos (defensa en profundidad)
        # MGC-1263: este workflow no debe contener `eas build` de Android en
        # ningún step. MGC-832: el patrón original (`eas[[:space:]]+build`)
        # matcheaba sus propios comentarios y el step iOS legítimo
        # (`eas build --local --platform ios`), por lo que el job fallaba
        # siempre. Restringimos a invocaciones reales de Android: líneas no
        # comentadas con `eas build ... --platform android`.
        run: |
          if grep -vE '^[[:space:]]*#' .github/workflows/eas.yml \
               | grep -nE 'eas[[:space:]]+build.*--platform[[:space:]]+android'; then
            echo 'ERROR: eas.yml contiene un eas build de Android. Política MGC-1263: este workflow es smoke-only para Android.' >&2
            exit 1
          fi
          echo '[smoke] sin eas build android en eas.yml — política MGC-1263 OK'
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Patch expo-modules-core (worklets executeSync → runSync)
        run: node scripts/patch-expo-modules-core.js
      - name: Lint (src/**/*.{ts,tsx})
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  preview-ios:
    # Único job de este workflow que aún produce artefacto. Corre en el
    # runner-02 (Mac mini ARM64) con profile preview-ios-sim (no requiere
    # distribution cert). Migrado en MGC-1132 (PR #296 f19052c) tras
    # starvation del runner-01.
    # MGC-1374: timeout 50 min. eas build --local + simulador iOS puede
    # demorar 25-35 min en cold cache; 50 deja margen sin quedar colgado
    # indefinidamente si la queue de EAS no responde.
    name: preview ios (eas build --local, simulator)
    runs-on: [self-hosted, copero-heavy]
    timeout-minutes: 50
    needs: changes
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar eas-cli + infisical CLI
        run: |
          bash scripts/install-eas-cli.sh
          if ! command -v infisical >/dev/null 2>&1; then
            curl -1sLf https://artifacts-cli.infisical.com/setup.deb.sh | sudo -E bash
            sudo apt-get update -qq && sudo apt-get install -y -qq infisical
            command -v infisical >/dev/null 2>&1 || {
              echo "ERROR: infisical no quedó instalado; abortando" >&2
              exit 1
            }
          fi
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Patch expo-modules-core (worklets executeSync → runSync)
        run: node scripts/patch-expo-modules-core.js
      - name: Cargar secretos (Infisical path=/copero env=prod)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          if [[ -z "${INFISICAL_PROJECT_ID:-}" ]]; then
            echo "ERROR: INFISICAL_PROJECT_ID ausente. Configurar en GitHub repo secrets." >&2
            exit 1
          fi
          # Prefer universal-auth (MGC-1227): emite un JWT fresco por run a partir de
          # client_credentials, evitando la caducidad del secret estático INFISICAL_TOKEN.
          # Fallback al token estático solo si los client credentials no están seteados.
          if [[ -n "${INFISICAL_CLIENT_ID:-}" && -n "${INFISICAL_CLIENT_SECRET:-}" ]]; then
            echo "[eas-preview] usando universal-auth (INFISICAL_CLIENT_ID/SECRET)"
            INFISICAL_TOKEN=$(infisical login --method universal-auth \
              --client-id "${INFISICAL_CLIENT_ID}" \
              --client-secret "${INFISICAL_CLIENT_SECRET}" \
              --plain 2>/dev/null | tail -1)
            if [[ -z "${INFISICAL_TOKEN:-}" ]]; then
              echo "ERROR: universal-auth no emitió JWT; abortando" >&2
              exit 1
            fi
            export INFISICAL_TOKEN
          elif [[ -n "${INFISICAL_TOKEN:-}" ]]; then
            echo "[eas-preview] usando INFISICAL_TOKEN estático (legacy; considerar migrar a universal-auth)"
          else
            echo "ERROR: ni INFISICAL_TOKEN ni INFISICAL_CLIENT_ID/SECRET presentes en repo secrets." >&2
            exit 1
          fi
          mkdir -p .infisical-tmp
          if ! infisical export \
              --projectId="${INFISICAL_PROJECT_ID}" \
              --env=prod --path=/copero --format=dotenv > .env; then
            echo "ERROR: infisical export falló; abortando build" >&2
            exit 1
          fi
          if ! grep -q '^EXPO_TOKEN=' .env; then
            echo "ERROR: EXPO_TOKEN ausente en Infisical /copero env=prod (placeholder o no seteado)." >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          if [[ "${EXPO_TOKEN}" == "test" || "${EXPO_TOKEN}" == "placeholder" ]]; then
            echo "ERROR: EXPO_TOKEN es placeholder ('${EXPO_TOKEN}'); cargar valor real en Infisical /copero env=prod." >&2
            exit 1
          fi
          echo "EXPO_TOKEN=${EXPO_TOKEN}" >> "$GITHUB_ENV"
          echo "[eas-preview] EXPO_TOKEN cargado desde Infisical (longitud=${#EXPO_TOKEN})"
      - name: eas init (link proyecto no-interactive)
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: |
          if grep -q '"projectId"' eas.json; then
            echo "eas.json ya tiene projectId; skip init"
          else
            eas init --id 27354a3b-2ab8-46c1-8ed2-2d5448b0e71a --non-interactive || {
              echo "WARN: eas init fallo, intentando continuar con extra.eas.projectId"
            }
          fi
      - name: eas build --local (ios, profile=preview-ios-sim)
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
        run: |
          eas build --local --platform ios --profile preview-ios-sim --non-interactive