# ci.yml — Copero (MGC-290, MGC-1880)
# Pipeline CI: lint (eslint), typecheck (tsc), test web (vitest), build web (Expo web export).
# Política §8.3: builds --local; runner self-hosted (Mac mini del operador).
# Trigger: push a main/release-* y PRs contra main.
# Artefacto: `web-build` (Expo web export).
# MGC-2263: en `mgcstudios86/copero` (fork) no hay runner self-hosted con label
# `copero-ci` registrado. El runner-01 del VPS está en `mgcstudios/copero` (otro
# repo), por lo que no resuelve jobs acá. CEO autorizó fallback hosted runner
# (ubuntu-latest) hasta que el operador migre el runner o los cambios a main del
# repo canónico.

name: ci (copero)

on:
  pull_request:
    branches: [main, 'release-*']
  push:
    branches:
      - main
      - 'release-*'
  workflow_dispatch:

concurrency:
  group: ci-copero-${{ github.event.pull_request.number || github.ref }}
  # MGC-2218: no cancelar runs en vuelo cuando el trigger es workflow_dispatch
  # (typecheck ~13min paga el pato). push/PR mantienen cancel-in-progress para
  # no apilar dos pushes seguidos sobre el mismo ref.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'app/**'
              - 'App.tsx'
              - 'index.ts'
              - 'app.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            lint:
              - 'src/**'
              - 'app/**'
              - 'App.tsx'
              - '*.ts'
              - '*.tsx'
              - 'package.json'
              - 'package-lock.json'
              - '.eslintrc*'
              - 'eslint.config.*'
            typecheck:
              - 'src/**'
              - 'app/**'
              - 'App.tsx'
              - 'index.ts'
              - '*.ts'
              - '*.tsx'
              - 'tsconfig*.json'
              - 'package.json'
              - 'package-lock.json'
            tests:
              - 'src/**'
              - 'app/**'
              - '__tests__/**'
              - '*.test.ts'
              - '*.test.tsx'
              - '*.spec.ts'
              - '*.spec.tsx'
              - 'vitest.config.*'
              - 'jest.config.*'
              - 'package.json'
              - 'package-lock.json'

  lint:
    name: lint (eslint)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps (npm ci)
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos de Infisical (lint usa sólo PUBLIC_* si los hay)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if command -v infisical >/dev/null 2>&1 \
            && [[ -n "${INFISICAL_TOKEN:-}" ]] \
            && [[ -n "${INFISICAL_PROJECT_ID:-}" ]]; then
            echo "[lint] cargando secretos Infisical path=/copero env=dev"
            infisical export --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env || true
          else
            echo "[lint] infisical CLI, token o projectId ausente — saltando carga de secretos"
          fi
      - name: Ejecutar eslint
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0 --no-error-on-unmatched-pattern

  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos (no requerido para tsc; placeholder si .env lo lee app.config.js)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if command -v infisical >/dev/null 2>&1 \
            && [[ -n "${INFISICAL_TOKEN:-}" ]] \
            && [[ -n "${INFISICAL_PROJECT_ID:-}" ]]; then
            infisical export --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env || true
          else
            echo "[typecheck] infisical CLI, token o projectId ausente — saltando carga de secretos"
          fi
      - run: npx tsc --noEmit

  test-web:
    name: test web (vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos para tests
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if command -v infisical >/dev/null 2>&1 \
            && [[ -n "${INFISICAL_TOKEN:-}" ]] \
            && [[ -n "${INFISICAL_PROJECT_ID:-}" ]]; then
            infisical export --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env || true
          else
            echo "[test-web] infisical CLI, token o projectId ausente — saltando carga de secretos"
          fi
      - name: Ejecutar vitest (una pasada, reporter básico)
        run: npx vitest run --reporter=basic

  build-web:
    name: build web (expo export --platform web)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar eas-cli
        run: bash scripts/install-eas-cli.sh
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos desde Infisical (path=/copero)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if ! command -v infisical >/dev/null 2>&1; then
            echo "[build-web] instalando infisical CLI"
            curl -sSfL https://raw.githubusercontent.com/infisical/infisical/main/cli/get-cli.sh | sh -s -- -b /usr/local/bin
          fi
          if [[ -z "${INFISICAL_TOKEN:-}" ]]; then
            echo "WARN: INFISICAL_TOKEN ausente — se omite carga de secretos" >&2
          elif [[ -z "${INFISICAL_PROJECT_ID:-}" ]]; then
            echo "WARN: INFISICAL_PROJECT_ID ausente — se omite carga de secretos" >&2
          else
            mkdir -p .infisical-tmp
            infisical export \
              --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env
          fi
      - name: Expo web export (artefacto dist/)
        run: npm run build:web
      - name: Pre-comprimir assets a gzip level 9 (MGC-538)
        run: node scripts/precompress-assets.mjs dist
      - name: Subir artefacto dist/
        uses: actions/upload-artifact@v4
        # MGC-2194 (PR #494 ya mergeado en release-2): el quota de GitHub Actions
        # artifact storage hace fallar el upload aunque el export sea correcto.
        # Soft-fail para que el gate §8.1 no quede rojo por infra no-deterministica.
        continue-on-error: true
        with:
          name: copero-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  devops-comment:
    name: devops-comment (gate §8.1)
    runs-on: ubuntu-latest
            - Artefacto: `copero-web-build` (sólo si `build-web` ✅)
        env:
          GITHUB_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
