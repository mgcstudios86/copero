# ci.yml — Copero (MGC-290, MGC-1880)
# Pipeline CI: lint (eslint), typecheck (tsc), test web (vitest), build web (Expo web export).
# Política §8.3: builds --local; runner self-hosted (Mac mini del operador).
# Trigger: push a main/release-* y PRs contra main.
# Artefacto: `web-build` (Expo web export).
# MGC-2263: en `mgcstudios86/copero` (fork) no hay runner self-hosted con label
# `copero-ci` registrado. El runner-01 del VPS está en `mgcstudios/copero` (otro
# repo), por lo que no resuelve jobs acá. CEO autorizó fallback hosted runner
# (ubuntu-latest) hasta que el operador migre el runner o los cambios a main del
# repo canónico.

name: ci (copero)

on:
  pull_request:
    branches: [main, 'release-*']
  push:
    branches:
      - main
      - 'release-*'
  workflow_dispatch:

concurrency:
  # MGC-2218: workflow_dispatch usa un group único (run_id) para que dos
  # dispatch manuales sobre el mismo ref nunca compitan entre sí y typecheck
  # (~13min) nunca pague cancelaciones. push y PR sí cancelan el run previo
  # en el mismo ref (push repetido no apila).
  group: >-
    ci-copero-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'app/**'
              - 'App.tsx'
              - 'index.ts'
              - 'app.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            lint:
              - 'src/**'
              - 'app/**'
              - 'App.tsx'
              - '*.ts'
              - '*.tsx'
              - 'package.json'
              - 'package-lock.json'
              - '.eslintrc*'
              - 'eslint.config.*'
            typecheck:
              - 'src/**'
              - 'app/**'
              - 'App.tsx'
              - 'index.ts'
              - '*.ts'
              - '*.tsx'
              - 'tsconfig*.json'
              - 'package.json'
              - 'package-lock.json'
            tests:
              - 'src/**'
              - 'app/**'
              - '__tests__/**'
              - '*.test.ts'
              - '*.test.tsx'
              - '*.spec.ts'
              - '*.spec.tsx'
              - 'vitest.config.*'
              - 'jest.config.*'
              - 'package.json'
              - 'package-lock.json'

  lint:
    name: lint (eslint)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cachear npm (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Instalar deps (npm ci)
        run: npm ci --cache ~/.npm --prefer-offline --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos de Infisical (lint usa sólo PUBLIC_* si los hay)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if command -v infisical >/dev/null 2>&1 \
            && [[ -n "${INFISICAL_TOKEN:-}" ]] \
            && [[ -n "${INFISICAL_PROJECT_ID:-}" ]]; then
            echo "[lint] cargando secretos Infisical path=/copero env=dev"
            infisical export --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env || true
          else
            echo "[lint] infisical CLI, token o projectId ausente — saltando carga de secretos"
          fi
      - name: Ejecutar eslint
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0 --no-error-on-unmatched-pattern

  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cachear npm (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci --cache ~/.npm --prefer-offline --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos (no requerido para tsc; placeholder si .env lo lee app.config.js)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if command -v infisical >/dev/null 2>&1 \
            && [[ -n "${INFISICAL_TOKEN:-}" ]] \
            && [[ -n "${INFISICAL_PROJECT_ID:-}" ]]; then
            infisical export --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env || true
          else
            echo "[typecheck] infisical CLI, token o projectId ausente — saltando carga de secretos"
          fi
      - run: npx tsc --noEmit

  test-web:
    name: test web (vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cachear npm (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci --cache ~/.npm --prefer-offline --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos para tests
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if command -v infisical >/dev/null 2>&1 \
            && [[ -n "${INFISICAL_TOKEN:-}" ]] \
            && [[ -n "${INFISICAL_PROJECT_ID:-}" ]]; then
            infisical export --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env || true
          else
            echo "[test-web] infisical CLI, token o projectId ausente — saltando carga de secretos"
          fi
      - name: Ejecutar vitest (una pasada, reporter básico)
        run: npx vitest run --reporter=basic

  build-web:
    name: build web (expo export --platform web)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar eas-cli
        run: bash scripts/install-eas-cli.sh
      - name: Cachear npm (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci --cache ~/.npm --prefer-offline --include=dev --ignore-scripts --no-audit --no-fund
      - name: Cargar secretos desde Infisical (path=/copero)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          if ! command -v infisical >/dev/null 2>&1; then
            echo "[build-web] instalando infisical CLI"
            curl -sSfL https://raw.githubusercontent.com/infisical/infisical/main/cli/get-cli.sh | sh -s -- -b /usr/local/bin
          fi
          if [[ -z "${INFISICAL_TOKEN:-}" ]]; then
            echo "WARN: INFISICAL_TOKEN ausente — se omite carga de secretos" >&2
          elif [[ -z "${INFISICAL_PROJECT_ID:-}" ]]; then
            echo "WARN: INFISICAL_PROJECT_ID ausente — se omite carga de secretos" >&2
          else
            mkdir -p .infisical-tmp
            infisical export \
              --projectId="${INFISICAL_PROJECT_ID}" \
              --env=dev --path=/copero --format=dotenv > .env
          fi
      - name: Expo web export (artefacto dist/)
        run: npm run build:web
      - name: Pre-comprimir assets a gzip level 9 (MGC-538)
        run: node scripts/precompress-assets.mjs dist
      - name: Subir artefacto dist/
        uses: actions/upload-artifact@v4
        with:
          name: copero-web-dist
          path: dist
          if-no-files-found: warn
        # MGC-2194: la cuota de artefactos del runner self-hosted se satura de
        # forma intermitente en jobs largos; un fallo aquí no debe tumbar CI.
        # El artefacto sigue siendo necesario para QA, pero la pipeline puede
        # seguir si está saturada.
        continue-on-error: true

  devops-comment:
    name: devops-comment (gate §8.1)
    runs-on: [self-hosted, copero-ci]
    # MGC-2236: `changes` debe estar en `needs:` para que
    # `needs.changes.outputs.*` se evalúe (los outputs del job de paths-filter
    # se propagan sólo si el job aparece en la lista de dependencias).
    needs: [changes, lint, typecheck, test-web, build-web]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Compute status table + gate verdict
        id: status
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test-web.result }}
          BUILD_RESULT: ${{ needs.build-web.result }}
          LINT_FILTER: ${{ needs.changes.outputs.lint }}
          TYPECHECK_FILTER: ${{ needs.changes.outputs.typecheck }}
          TESTS_FILTER: ${{ needs.changes.outputs.tests }}
          WEB_FILTER: ${{ needs.changes.outputs.web }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅ pass";;
              failure) echo "❌ fail";;
              skipped) echo "⏭️ skipped";;
              *) echo "⚠️ $1";;
            esac
          }
          {
            echo "result<<EOF"
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| lint (eslint) | $(icon "$LINT_RESULT") |"
            echo "| typecheck (tsc --noEmit) | $(icon "$TYPECHECK_RESULT") |"
            echo "| test-web (vitest) | $(icon "$TEST_RESULT") |"
            echo "| build-web (expo export) | $(icon "$BUILD_RESULT") |"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # MGC-1860 — gate §8.1 #3 sólo se cumple si cada job que debía
          # correr terminó SUCCESS. ADR-0019 BLOQ-1: un job en `skipped`
          # es legítimo sólo cuando el filtro de paths correspondiente
          # lo excluyó (`changes.outputs.X == 'false'`). Si el filtro
          # marcó el job como aplicable pero terminó `skipped`/`failure`
          # /`cancelled`/`timed_out`, el gate FALLA y bloquea el merge.
          ok() {
            # $1 = job result, $2 = filter output ('true'|'false')
            case "$1" in
              success) return 0;;
              skipped)
                if [[ "$2" == "false" ]]; then
                  return 0
                fi
                return 1
                ;;
              *) return 1;;
            esac
          }
          lint_ok="no"
          typecheck_ok="no"
          test_ok="no"
          build_ok="no"
          if ok "$LINT_RESULT" "$LINT_FILTER"; then lint_ok="yes"; fi
          if ok "$TYPECHECK_RESULT" "$TYPECHECK_FILTER"; then typecheck_ok="yes"; fi
          if ok "$TEST_RESULT" "$TESTS_FILTER"; then test_ok="yes"; fi
          if ok "$BUILD_RESULT" "$WEB_FILTER"; then build_ok="yes"; fi
          if [[ "$lint_ok" == "yes" \
             && "$typecheck_ok" == "yes" \
             && "$test_ok" == "yes" \
             && "$build_ok" == "yes" ]]; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
            echo "::error title=§8.1 gate #3 no cumplido:: lint=$LINT_RESULT(filter=$LINT_FILTER) typecheck=$TYPECHECK_RESULT(filter=$TYPECHECK_FILTER) test-web=$TEST_RESULT(filter=$TESTS_FILTER) build-web=$BUILD_RESULT(filter=$WEB_FILTER)"
            exit 1
          fi
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          name: copero-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  devops-comment:
    name: devops-comment (gate §8.1)
    runs-on: ubuntu-latest
            - Artefacto: `copero-web-build` (sólo si `build-web` ✅)
        env:
          GITHUB_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
