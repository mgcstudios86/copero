# release-internal.yml — Copero (MGC-250, MGC-1374, skill expo-cicd-workflows §release-internal)
# Pipeline canónico: merge a main → build --local Android + iOS → submit --track internal.
# Política §8.3 (engineering-workflow): builds --local; runner self-hosted (copero-ci).
# Sólo `internal` como destino. Promoción a alpha/production la hace el operador a mano.
#
# MGC-1374: el job android-internal se movió a runner-02 (copero-ci, macOS).
# El runner-01 (VPS mgcstudios-01, 954 MB / 2 vCPU) no sostiene Android:
# historial 0/30 success — mismo motivo que sacó Android de eas.yml en MGC-1263.
# Los self-hosted runners son single-job; mover Android al mismo runner que iOS
# libera runner-01 para que ci.yml y eas.yml puedan respirar sin starvation.

name: release-internal (copero)

on:
  push:
    branches: [main]
  workflow_dispatch:    # reintentos manuales del operador

concurrency:
  group: release-internal-copero-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-internal:
    name: android build + submit internal (eas build --local)
    # MGC-1374: Android migrado de Linux a macOS (runner-02). Historial 0/30 success
    # sobre runner-01 (954 MB / 2 vCPU); mismo argumento que sacó Android de eas.yml
    # en MGC-1263. Concurrency cancel-in-progress ya está arriba; con un único job
    # por runner self-hosted, no hay contención cruzada entre android-internal e
    # ios-internal porque la job ios usa el mismo label y se serializa naturalmente.
    runs-on: [self-hosted, copero-ci, macOS]
    timeout-minutes: 60
    env:
      # Skill local-build §Java setup: en el runner copero-ci JDK 17 está disponible vía default.
      # SDK 57 expo-modules-core 57.0.12 peer dep bug (MGC-366); ver eas.yml.
      EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # CLAUDE.md: NO usar cache: 'npm' (MGC-359, sube ~800MB y bloquea runner).

      - name: Instalar eas-cli + infisical CLI
        run: |
          bash scripts/install-eas-cli.sh
          if ! command -v infisical >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/infisical/infisical/main/cli/get-cli.sh | sh -s -- -b /usr/local/bin
          fi

      - name: npm ci (deps)
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Patch expo-modules-core (worklets executeSync → runSync, MGC-366)
        run: node scripts/patch-expo-modules-core.js

      - name: Load EXPO_TOKEN (Infisical /copero env=prod, MGC-1486)
        # MGC-1486: el secret INFISICAL_TOKEN largo de vida no tenía lectura sobre /copero.
        # Switch a universal-auth JWT generado on-the-fly usando CLIENT_ID+CLIENT_SECRET
        # (mismo principal que mi shell local — ya verificado que lee /copero OK).
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          if [[ -z "${INFISICAL_CLIENT_ID:-}" || -z "${INFISICAL_CLIENT_SECRET:-}" || -z "${INFISICAL_PROJECT_ID:-}" ]]; then
            echo "ERROR: Infisical CLIENT_ID/CLIENT_SECRET/PROJECT_ID ausentes en repo. POLICIES §3: escalar al CTO." >&2
            exit 1
          fi
          INFISICAL_JWT=$(infisical login --method universal-auth \
            --client-id "${INFISICAL_CLIENT_ID}" \
            --client-secret "${INFISICAL_CLIENT_SECRET}" \
            --plain --silent 2>/dev/null | tail -1)
          if [[ -z "${INFISICAL_JWT}" ]]; then
            echo "ERROR: universal-auth login falló (JWT vacío). Escalar al CTO." >&2
            exit 1
          fi
          EXPO_TOKEN=$(infisical export \
            --projectId "${INFISICAL_PROJECT_ID}" \
            --env=prod --path=/copero --format=dotenv \
            --token "${INFISICAL_JWT}" 2>/dev/null \
            | grep -E '^(paperclip-expo-eas-token|EXPO_TOKEN)=' | head -1 | cut -d= -f2-)
          # MGC-1486: dotenv format envuelve defensivamente en single quotes — strip.
          EXPO_TOKEN="${EXPO_TOKEN#\'}"
          EXPO_TOKEN="${EXPO_TOKEN%\'}"
          EXPO_TOKEN="${EXPO_TOKEN#\"}"
          EXPO_TOKEN="${EXPO_TOKEN%\"}"
          if [[ -z "${EXPO_TOKEN}" || "${EXPO_TOKEN}" == "test" || "${EXPO_TOKEN}" == "placeholder" ]]; then
            echo "ERROR: EXPO_TOKEN ausente o placeholder en Infisical /copero env=prod." >&2
            exit 1
          fi
          echo "EXPO_TOKEN=${EXPO_TOKEN}" >> "$GITHUB_ENV"
          echo "[release-internal] EXPO_TOKEN cargado (length=${#EXPO_TOKEN})"

      - name: eas init (link proyecto no-interactive)
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: |
          if grep -q '"projectId"' eas.json; then
            echo "eas.json ya tiene projectId; skip init"
          else
            eas init --id 27354a3b-2ab8-46c1-8ed2-2d5448b0e71a --non-interactive || true
          fi

      - name: Android build (eas build --local, profile=preview, distribution=internal)
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: |
          mkdir -p dist
          eas build --local --platform android --profile preview --non-interactive

      - name: Locate AAB/Android APK
        # MGC-1491: eas build --local --profile preview produce app-release.apk por default
        # (preview profile no setea android.buildType=app-bundle). Aceptamos *.aab o *.apk
        # para que Submit to internal (Android) reciba el artefacto firmado real.
        id: locate
        run: |
          ARTIFACT=$(find dist -maxdepth 3 \( -name '*.aab' -o -name '*.apk' \) -type f | head -1 || true)
          if [[ -z "${ARTIFACT}" ]]; then
            echo "ERROR: no se encontró AAB/APK Android en dist/" >&2
            find . -maxdepth 5 \( -name '*.aab' -o -name '*.apk' \) -type f 2>/dev/null
            exit 1
          fi
          echo "aab_path=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "artifact: ${ARTIFACT}"

      - name: Submit to internal (Android)
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: |
          eas submit --platform android --track internal --non-interactive

      - name: Resumen + SHA256 del artefacto Android
        if: always()
        run: |
          set -euo pipefail
          AAB="${{ steps.locate.outputs.aab_path }}"
          if [[ -n "${AAB}" && -f "${AAB}" ]]; then
            SHA=$(sha256sum "${AAB}" | awk '{print $1}')
            SIZE=$(stat -c %s "${AAB}")
            {
              echo "## Artefacto Android firmado (copero)"
              echo "- path: ${AAB}"
              echo "- sha256: ${SHA}"
              echo "- size: ${SIZE} bytes"
              echo "- track: internal (Play Console)"
              echo "- merge_sha: ${GITHUB_SHA}"
              echo "- workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARN: no se encontró artefacto; revisa el step locate." >&2
          fi

  ios-internal:
    name: ios build + submit internal (simulator preview, best-effort) [MGC-360]
    # MGC-1132: mismo motivo que eas.yml preview-ios — iOS va al runner macOS ARM64
    # (runner-02) y deja libre el slot Linux para el build Android de este workflow.
    runs-on: [self-hosted, copero-ci, macOS]
    timeout-minutes: 60
    continue-on-error: true
    env:
      EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar eas-cli + infisical CLI
        run: |
          bash scripts/install-eas-cli.sh
          if ! command -v infisical >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/infisical/infisical/main/cli/get-cli.sh | sh -s -- -b /usr/local/bin
          fi
      - name: npm ci (deps)
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Patch expo-modules-core (worklets executeSync → runSync, MGC-366)
        run: node scripts/patch-expo-modules-core.js
      - name: Load EXPO_TOKEN (Infisical /copero env=prod, MGC-1486)
        # MGC-1486: ver android-internal — mismo patrón universal-auth JWT.
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          INFISICAL_JWT=$(infisical login --method universal-auth \
            --client-id "${INFISICAL_CLIENT_ID}" \
            --client-secret "${INFISICAL_CLIENT_SECRET}" \
            --plain --silent 2>/dev/null | tail -1)
          if [[ -z "${INFISICAL_JWT}" ]]; then
            echo "ERROR: universal-auth login falló (JWT vacío). Escalar al CTO." >&2
            exit 1
          fi
          EXPO_TOKEN=$(infisical export \
            --projectId "${INFISICAL_PROJECT_ID}" \
            --env=prod --path=/copero --format=dotenv \
            --token "${INFISICAL_JWT}" 2>/dev/null \
            | grep -E '^(paperclip-expo-eas-token|EXPO_TOKEN)=' | head -1 | cut -d= -f2-)
          # MGC-1486: dotenv format envuelve defensivamente en single quotes — strip.
          EXPO_TOKEN="${EXPO_TOKEN#\'}"
          EXPO_TOKEN="${EXPO_TOKEN%\'}"
          EXPO_TOKEN="${EXPO_TOKEN#\"}"
          EXPO_TOKEN="${EXPO_TOKEN%\"}"
          if [[ -z "${EXPO_TOKEN}" || "${EXPO_TOKEN}" == "test" || "${EXPO_TOKEN}" == "placeholder" ]]; then
            echo "ERROR: EXPO_TOKEN ausente o placeholder en Infisical /copero env=prod." >&2
            exit 1
          fi
          echo "EXPO_TOKEN=${EXPO_TOKEN}" >> "$GITHUB_ENV"
          echo "[release-internal ios] EXPO_TOKEN cargado (length=${#EXPO_TOKEN})"
      - name: eas init
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' eas.json; then
            eas init --id 27354a3b-2ab8-46c1-8ed2-2d5448b0e71a --non-interactive || true
          fi
      - name: iOS build (simulator preview)
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: |
          eas build --local --platform ios --profile preview-ios-sim --non-interactive
      - name: iOS submit internal
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: |
          eas submit --platform ios --track internal --non-interactive
