# deploy-ios-production.yml — Copero (MGC-294, MGC-316, MGC-503, MGC-504)
# Workflow manual para build iOS production y submit opcional a App Store Connect.
# Trigger: workflow_dispatch (DevOps dispara desde gh CLI / web UI).
#
# Política §8.3: builds --local. Este workflow usa `eas build` (cloud) para
# iOS production porque el runner macOS self-hosted (copero-ci-runner-02)
# no tiene Apple Distribution cert (.p12) ni provisioning profile en el
# keychain local. EAS Build cloud firma el IPA via ASC API (.p8) que ya está
# cargado en Infisical. Excepción documentada en MGC-497 / MGC-294.
#
# Runner: [self-hosted, copero-ci, macOS] (copero-ci-runner-02, ARM64).
# Sin cache: 'npm' en setup-node@v4 (MGC-359).
# Step `npm ci` requerido: run 32677245778 fallaba con
# "Failed to resolve plugin for module expo-router ... Do you have node modules installed?"
# porque EAS cloud sube el proyecto sin node_modules. Solucionado en MGC-503.
#
# EXPO_ASC_* env vars requeridos: run 32677609285 fallaba con
# "Distribution Certificate is not validated for non-interactive builds.
#  Failed to set up credentials. Credentials are not set up."
# porque EAS sin credenciales cacheadas intenta setup interactivo. Cargamos
# APPLE_ASC_API_KEY (.p8) / KEY_ID / ISSUER_ID desde /mgcstudios/appstore y los
# exportamos como EXPO_ASC_API_KEY_PATH / KEY_ID / ISSUER_ID. EAS auto-genera
# el Distribution Certificate + provisioning profile sin modo interactivo.
# Solucionado en MGC-504.

name: deploy-ios-production (copero)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to App Store Connect after build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-ios-production-copero
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build iOS production (cloud, ASC API signing)
    runs-on: [self-hosted, copero-ci, macOS]
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify eas.json production profile
        run: |
          python3 -c "
          import json
          with open('eas.json') as f:
              cfg = json.load(f)
          assert cfg['submit']['production']['ios']['ascAppId'] == '6804506917', 'ascAppId mismatch'
          assert cfg['submit']['production']['ios']['appleTeamId'] == '5M4NR9267P', 'appleTeamId mismatch'
          print('eas.json submit.production.ios OK')
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (npm ci)
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "FATAL: package-lock.json missing — generate with 'npm i' first"; exit 1
          fi
          npm ci
          echo "node_modules installed at $(date -u +%FT%TZ)"

      - name: Install eas-cli
        run: npm install -g eas-cli@latest

      - name: Load EXPO_TOKEN from Infisical (fallback to GH secret)
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            EXP="$(infisical export --env=prod --path=/copero | grep ^EXPO_TOKEN= | cut -d= -f2-)"
            if [ -z "$EXP" ]; then echo "FATAL: EXPO_TOKEN missing"; exit 1; fi
            echo "EXPO_TOKEN=$EXP" >> "$GITHUB_ENV"
            echo "Loaded EXPO_TOKEN from Infisical (length: ${#EXP})"
          else
            echo "EXPO_TOKEN from GH secret (length: ${#EXPO_TOKEN})"
          fi

      - name: Load ASC API credentials from Infisical (/mgcstudios/appstore)
        # MGC-294 fix: eas build --non-interactive requiere EXPO_ASC_* env vars
        # para que EAS auto-genere el Distribution Certificate + provisioning
        # profile sin modo interactivo. Carga .p8 desde /mgcstudios/appstore.
        run: |
          set -euo pipefail
          ASC_DIR="$(infisical export --env=prod --path=/mgcstudios/appstore)"
          KEY_ID="$(printf '%s\n' "$ASC_DIR" | sed -n 's/^APPLE_ASC_API_KEY_ID=//p' | head -1)"
          ISSUER_ID="$(printf '%s\n' "$ASC_DIR" | sed -n 's/^APPLE_ASC_API_ISSUER_ID=//p' | head -1)"
          P8="$(printf '%s\n' "$ASC_DIR" | sed -n '/^APPLE_ASC_API_KEY=$/,/^[^ ]/p' | sed '/^$/d')"
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$P8" ]; then
            echo "FATAL: ASC API secrets missing in /mgcstudios/appstore"; exit 1
          fi
          printf '%s\n' "$P8" > /tmp/copero-asc.p8
          chmod 600 /tmp/copero-asc.p8
          if ! head -1 /tmp/copero-asc.p8 | grep -q 'BEGIN PRIVATE KEY'; then
            echo "FATAL: /tmp/copero-asc.p8 does not look like a .p8"; exit 1
          fi
          {
            echo "EXPO_ASC_API_KEY_PATH=/tmp/copero-asc.p8"
            echo "EXPO_ASC_KEY_ID=$KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=5M4NR9267P"
            echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION"
          } >> "$GITHUB_ENV"
          echo "ASC API credentials loaded: key_id=${KEY_ID}, issuer=${ISSUER_ID}, .p8=$(wc -c </tmp/copero-asc.p8) bytes"

      - name: Build iOS production (cloud, signed via ASC API)
        env:
          CI: "1"
        run: |
          set -euo pipefail
          echo "Starting eas build production iOS at $(date -u +%FT%TZ)"
          # Cloud build. EAS firma vía ASC API key (.p8) cargado por la org mgcstudios86.
          # Variables EXPO_ASC_* las aporta el step anterior para evitar el modo interactivo.
          eas build \
            --profile production \
            --platform ios \
            --non-interactive \
            --wait \
            --json \
            > /tmp/eas-build.json 2> /tmp/eas-build.log
          BUILD_ID="$(python3 -c "import json; d=json.load(open('/tmp/eas-build.json')); print(d.get('id') or d.get('buildId') or '')")"
          BUILD_VERSION="$(python3 -c "import json; d=json.load(open('/tmp/eas-build.json')); print(d.get('metadata',{}).get('appVersion') or '')")"
          echo "BUILD_ID=$BUILD_ID" > /tmp/build-meta.txt
          echo "BUILD_VERSION=$BUILD_VERSION" >> /tmp/build-meta.txt
          echo "Build finished at $(date -u +%FT%TZ)"
          echo "EAS Build ID: $BUILD_ID"
          echo "App version: $BUILD_VERSION"
          cat /tmp/build-meta.txt

      - name: Submit to App Store Connect (track=production)
        if: ${{ inputs.submit == 'true' }}
        env:
          CI: "1"
        run: |
          set -euo pipefail
          BUILD_ID="$(grep ^BUILD_ID= /tmp/build-meta.txt | cut -d= -f2)"
          if [ -z "$BUILD_ID" ]; then echo "FATAL: BUILD_ID empty"; exit 1; fi
          eas submit \
            --profile production \
            --platform ios \
            --id "$BUILD_ID" \
            --non-interactive \
            --wait
          echo "Submission finished at $(date -u +%FT%TZ)"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copero-ios-production-build-log
          path: |
            /tmp/eas-build.json
            /tmp/eas-build.log
            /tmp/build-meta.txt
