# purge-stale-runs.yml — Copero (MGC-346)
# Cancela runs encolados de workflow_dispatch cuya rama NO tiene PR abierto contra main.
# El 2026-08-30 la cola llegó a 31 runs encolados por dispatch sobre ramas sin PR
# (ej. fix/mgc282-persistencia-hermes).
# Corre cada 15min en el runner Linux self-hosted (copero-ci-runner-01).
# Política §8.3: corre --local; el script usa gh CLI con el token del repo.

name: purge-stale-runs (copero)

on:
  schedule:
    # Cada 15min. GitHub schedule puede tener jitter; aceptable.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# MGC-351 H3 (iter 1): serializar invocaciones del workflow para evitar que dos
# purgas concurrentes cancelen el mismo run dos veces o peleen por el mismo output.
concurrency:
  group: purge-stale-runs-copero
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  purge:
    name: purge queued runs sin PR
    # ADR-0026 (MGC-2466): housekeeping de la API con gh CLI, sin toolchain.
    # Removido el `macOS`: runner-02 pasa a `copero-heavy` exclusivo, así que
    # `[copero-ci, macOS]` no matchearía ningún runner y el job quedaría queued
    # para siempre. `copero-ci` resuelve a runner-03 (Linux).
    runs-on: [self-hosted, copero-ci]
    timeout-minutes: 10
    steps:
      - name: Listar runs encolados y PRs abiertos
        # MGC-2909 (root cause): el bug era `--base main` en `gh pr list`.
        # Filtrar por `--base main` dejaba fuera TODAS las ramas cuyo PR
        # target era `release-N` o una feature branch de integración, y sus
        # `workflow_dispatch` encolados eran cancelados cada 15min (PRs #612,
        # #613, #614 contra release-5; #513/#503 contra release-2). Ademas
        # ramas base de PRs abiertos (ej. `feat/multi-slot-save` es base de
        # #614) no se protegian: si QA agent dispara un dispatch sobre la
        # base de integración, el run se purga aunque haya PR vivo apuntando
        # a ella. Fix: listar TODOS los PRs abiertos (sin filtro --base) y
        # conservar tanto headRefName como baseRefName.
        id: list
        env:
          GH_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # 1) PRs abiertos (head + base) — sin filtro --base.
          OPEN_HEADS=$(gh pr list --repo mgcstudios/copero \
              --state open --json headRefName \
              --jq '.[].headRefName' | sort -u)
          OPEN_BASES=$(gh pr list --repo mgcstudios/copero \
              --state open --json baseRefName \
              --jq '.[].baseRefName' | sort -u)
          OPEN_COUNT=$(printf '%s\n' "$OPEN_HEADS" | grep -c . || true)
          echo "PRs abiertos (heads): $OPEN_COUNT"
          printf '%s\n' "$OPEN_HEADS" | head -20
          echo "Bases de PRs abiertos:"
          printf '%s\n' "$OPEN_BASES" | head -20
          # 2) Runs encolados. gh run list --json fields --jq filtra.
          # MGC-351 M1 (iter 1): removida variable muerta INPROG_JSON
          # (solo se logueaba length, no se consumía downstream).
          QUEUED_JSON=$(gh run list --repo mgcstudios/copero \
              --status queued --limit 100 \
              --json databaseId,headBranch,workflowName,event,createdAt)
          echo "queued_count=$(printf '%s' "$QUEUED_JSON" | jq 'length')"
          {
            # MGC-410 (root cause): el bug NO era el nombre del delimitador sino
            # que `printf '%s' "$QUEUED_JSON"` (sin \n) dejaba el `echo "EOF"`
            # siguiente concatenado al final del JSON en la MISMA línea.
            # El parser de GitHub Actions busca una línea que sea EXACTAMENTE el
            # delimitador; como `}EOF` no matchea `EOF`, fallaba con
            # "Matching delimiter not found EOF".
            # Fix: usar `printf '%s\n'` para QUEUED_JSON así el delimitador
            # de cierre queda en su propia línea. Volvemos a `<<EOF` (es el
            # delimitador soportado por la doc oficial).
            echo "open_heads<<EOF"
            printf '%s\n' "$OPEN_HEADS"
            echo "EOF"
            echo "open_bases<<EOF"
            printf '%s\n' "$OPEN_BASES"
            echo "EOF"
            echo "queued_json<<EOF"
            printf '%s\n' "$QUEUED_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cancelar runs encolados (workflow_dispatch sin PR vivo)
        env:
          GH_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Parsear outputs.
          OPEN_HEADS=$(echo "${{ steps.list.outputs.open_heads }}")
          OPEN_BASES=$(echo "${{ steps.list.outputs.open_bases }}")
          QUEUED_JSON='${{ steps.list.outputs.queued_json }}'
          CANCELLED=0
          # MGC-351 M1 (iter 1): removida variable muerta SKIPPED (nunca se incrementaba).
          # MGC-2909: agregados globs `release-*` (todas las release branches)
          # y `main`. Las release branches son base legitima de PR de release-N
          # (#612, #613 target=release-5) y sus dispatch NO deben purgarse.
          ALWAYS_KEEP='main release-*'
          # Iterar runs encolados.
          # MGC-351 H1 (iter 1): done< <(...) reemplaza el pipe | while para que
          # CANCELLED persista fuera del loop (el pipe creaba subshell).
          while IFS= read -r RUN; do
            DBID=$(printf '%s' "$RUN" | jq -r '.databaseId')
            BRANCH=$(printf '%s' "$RUN" | jq -r '.headBranch // ""')
            WF=$(printf '%s' "$RUN" | jq -r '.workflowName')
            EVENT=$(printf '%s' "$RUN" | jq -r '.event')
            CREATED=$(printf '%s' "$RUN" | jq -r '.createdAt')
            # MGC-351 H2 (iter 1): filtro por event. Solo purgar workflow_dispatch
            # sin PR abierto. Otros eventos (push a main, pull_request legítimos,
            # schedule) tienen semántica distinta y NO deben purgarse aunque la
            # rama no tenga PR abierto (ej. push directo de QA agent a working branch).
            if [[ "$EVENT" != "workflow_dispatch" ]]; then
              echo "[skip] run=$DBID event=$EVENT no es workflow_dispatch"
              continue
            fi
            # - branch matchea ALWAYS_KEEP (main, release-*).
            ALWAYS_KEEP_MATCH=0
            for pat in $ALWAYS_KEEP; do
              if [[ "$BRANCH" == $pat ]]; then
                echo "[skip] run=$DBID branch=$BRANCH matched ALWAYS_KEEP=$pat"
                ALWAYS_KEEP_MATCH=1
                break
              fi
            done
            if [[ "$ALWAYS_KEEP_MATCH" -eq 1 ]]; then
              continue
            fi
            # - branch tiene PR abierto como headRefName.
            if printf '%s\n' "$OPEN_HEADS" | grep -qx "$BRANCH"; then
              echo "[skip] run=$DBID branch=$BRANCH head de PR abierto"
              continue
            fi
            # MGC-2909: branch es baseRefName de un PR abierto
            # (rama de integración, ej. feat/multi-slot-save base de #614).
            if printf '%s\n' "$OPEN_BASES" | grep -qx "$BRANCH"; then
              echo "[skip] run=$DBID branch=$BRANCH base de PR abierto"
              continue
            fi
            echo "[cancel] run=$DBID wf=$WF branch=$BRANCH event=$EVENT created=$CREATED"
            if gh run cancel "$DBID" --repo mgcstudios/copero 2>&1; then
              CANCELLED=$((CANCELLED + 1))
            fi
          done < <(printf '%s' "$QUEUED_JSON" | jq -c '.[]')
          echo "Resumen: cancelados (intentos)=$CANCELLED"

      - name: Resumen
        if: always()
        run: |
          echo "purge-stale-runs completado. Ver outputs arriba para detalle."
