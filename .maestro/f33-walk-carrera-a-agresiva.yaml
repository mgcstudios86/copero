# MGC-1786 / MGC-1633 — F3.3 Walk carrera-a agresiva (REESCRITO sobre
# a09ffbe / PR #470 UX1).
#
# Carrera corta agresiva: doble_turno consistente, peaks de fatiga al 30%,
# fin-carrera en 4-6 temporadas. No espera lesión; si lesión aparece, el
# flow sigue (regresión válida: el walk assertOnly valida que el motor
# no rompe con lesión).
#
# Precondiciones (ejecutar ANTES de `maestro test`):
#   1. APK pineado al SHA del PR que cerró UX1 (PR #470 a09ffbe) o
#      posterior. testIDs `team-select-card-${id}` y `btn-team-select-continue`
#      sólo existen desde PR #470.
#   2. adb shim en ~/.local/bin/adb (Homebrew adb 1.0.41 cuelga).
#   3. Device físico ZY22G728HN conectado (`adb devices`).
#   4. JAVA_HOME apuntando a openjdk@17:
#        export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   5. AsyncStorage limpio — el flow asume state vacío. Si hay save previo
#      el flow hidrata y este flow no llega a identity. Forzar reset con:
#        adb shell pm clear com.mgcstudios.copero
#
# AC (MGC-1786 AC actualizado):
#   - Carrera A: setup (identity con input-lastname + pos-ST + club velez)
#     → season-hub → 6 semanas de partido (doble_turno) → fin-carrera con
#     resumen. 6 matchweeks consumidas vía week-decision.doble_turno (en
#     UX1 el partido se resuelve en background via `resolveMatchweek()`;
#     NO se visita /match ni /post-match — el matchStore sólo persiste el
#     último outcome y el rating se ve en /temporada).
#   - Termina en /simulador-carrera/fin-carrera con stage='retirement'.
#
# Diferencias vs MGC-1786 PR #468 (a0354e1 sobre c33b9d2):
#   - PR #468 recorría academy → debut match → /match → /post-match → 5
#     temporadas de temporada con doble_turno. ESTE FLOW YA NO EXISTE en
#     main post-UX1.
#   - PR #470 reemplaza academy.tsx por team-select.tsx. El club pick es
#     el primer paso post-identity. NO hay debut match, NO hay /draft
#     inicial, NO hay /tu-jugador → /club final.
#   - week-decision.doble_turno RESUELVE el partido en background (no
#     navega a /match). Ver `weeklyDecisionTree.ts` línea 489. Carrera A
#     sigue jugando 6 partidos pero NO visita /match ni /post-match.
#   - retirement se fuerza vía btn-temporada-retire en /temporada tras N
#     temporadas. Más rápido que el motor natural (que dispara tras N
#     temporadas si la edad cruza el umbral).
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   adb shell pm clear com.mgcstudios.copero
#   maestro test .maestro/f33-walk-carrera-a-agresiva.yaml
#
# Owner del device: QA agent (ZY22G728HN). CI no corre Maestro mobile.

appId: com.mgcstudios.copero
name: f33-walk-carrera-a-agresiva
tags:
  - career
  - f3.3
  - walk
  - mgc-1786
  - mgc-1633
  - carrera-a
  - agresiva
  - ux1

---
# ── SETUP: home → identity (4 campos post-PR #427) ───────────────────
- launchApp:
    appId: com.mgcstudios.copero
    clearState: true

- assertVisible:
    id: home-screen
    label: "Home con CTA Jugar visible"
- assertVisible:
    id: btn-career
    label: "CTA Jugar presente"
- tapOn:
    id: btn-career
    label: "Tap Jugar → /identity"

- assertVisible:
    id: identity-screen
    label: "Pantalla identity montada"
- scrollUntilVisible:
    element:
      id: input-name
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-name
    text: "Mateo F33A"
- scrollUntilVisible:
    element:
      id: input-lastname
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-lastname
    text: "Agresiva"
- scrollUntilVisible:
    element:
      id: country-ARG
    direction: DOWN
    timeout: 5000
- tapOn:
    id: country-ARG
    label: "País Argentina"
# Carrera A agresiva: posición ST (delantero centro). Chips pos-{id}.
- scrollUntilVisible:
    element:
      id: pos-ST
    direction: DOWN
    timeout: 5000
- tapOn:
    id: pos-ST
    label: "Posición ST (delantero)"
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-identity-continue
    label: "Continuar → /team-select (PR #470 UX1)"

# ── TEAM-SELECT (PR #470 UX1 — REEMPLAZA academy.tsx) ────────────────
- assertVisible:
    id: team-select-screen
    label: "Pantalla team-select montada"
- scrollUntilVisible:
    element:
      id: team-select-card-velez
    direction: DOWN
    timeout: 5000
- tapOn:
    id: team-select-card-velez
    label: "Pick Vélez (club inicial)"
- assertVisible:
    id: btn-team-select-continue
    label: "CTA Continuar habilitado tras pick"
- tapOn:
    id: btn-team-select-continue
    label: "Continuar → /season-hub"
# PR #470 / MGC-1648: router.replace diferido 250ms (InteractionManager +
# rAF + setTimeout). Necesario timeout generoso.
- assertVisible:
    id: season-hub-scroll
    timeout: 8000
    label: "Season hub montado tras team-select"

# ── TEMPORADA: 6 semanas con doble_turno (PR #470 UX1) ────────────────
# season-hub → btn-season-hub-decide → /week-decision →
# btn-week-option-doble_turno → resolveMatchweek (background) →
# router.replace('/season-hub'). Sin visita a /match ni /post-match.
- repeat:
    times: 6
    commands:
      - scrollUntilVisible:
          element:
            id: btn-season-hub-decide
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-decide
          label: "Season hub → /week-decision"
      - assertVisible:
          id: week-decision-scroll
          timeout: 5000
          label: "Week decision montada"
      - scrollUntilVisible:
          element:
            id: btn-week-option-doble_turno
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-week-option-doble_turno
          label: "Pick doble_turno (consume partido en background)"
      - assertVisible:
          id: season-hub-scroll
          timeout: 8000
          label: "Vuelta a season-hub post-decisión"

# ── TEMPORADA SCREEN: forzar retirement ──────────────────────────────
- scrollUntilVisible:
    element:
      id: btn-season-hub-view-table
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-season-hub-view-table
    label: "Season hub → /temporada"
- assertVisible:
    id: temporada-screen
    timeout: 8000
    label: "Pantalla temporada montada"
# Avanzar 4 semanas (btn-temporada-next-week) para acumular más semanas
# de historial antes del retiro forzado.
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-next-week
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-next-week
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: btn-temporada-retire
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-temporada-retire
    label: "Retiro forzado → /fin-carrera"
- waitForAnimationToEnd

# ── FIN-CARRERA ──────────────────────────────────────────────────────
- assertVisible:
    id: fin-carrera-screen
    timeout: 8000
    label: "Pantalla fin-carrera con resumen"
# Resumen puede ser retire.summary (larga, 5+ temporadas) o
# retire.notFinished (corta, motor decidió fin anticipado). Carrera A
# agresiva target = retire.summary.
- assertVisible:
    text: "Resumen"
    label: "Resumen de carrera visible"
