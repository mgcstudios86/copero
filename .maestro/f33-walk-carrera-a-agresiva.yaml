# MGC-1786 / MGC-1633 — F3.3 Walk carrera-a agresiva.
#
# Carrera corta agresiva: doble_turno consistente, peaks de fatiga al 30%,
# fin-carrera en 4-6 temporadas. No espera lesión; si lesión aparece,
# el flow sigue (regresión válida: el walk assertOnly valida que el motor
# no rompe con lesión).
#
# Precondiciones (ejecutar ANTES de `maestro test`):
#   1. APK pineado al SHA del PR que cerró F3.2 motor (PR #425 c45c64c)
#      o posterior. testIDs estables desde PR #421 (WF4 partido+WF5 post-
#      match) + PR #427 (WF1 identidad reorganizada + chips + apellido).
#   2. adb shim en ~/.local/bin/adb (Homebrew adb 1.0.41 cuelga).
#   3. Device físico ZY22G728HN conectado (`adb devices`).
#   4. JAVA_HOME apuntando a openjdk@17:
#        export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   5. AsyncStorage limpio — el flow asume state vacío. Si hay save previo
#      el flow hidrata y este flow no llega a identity. Forzar reset con:
#        adb shell pm clear com.mgcstudios.copero
#
# AC (MGC-1786 AC actualizado):
#   - Carrera A: setup (identity con input-lastname + pos-ST + club velez)
#     → debut match → draft 4 rondas → club final (velez) →
#     loop agresivo 5 temporadas (doble_turno) → fin-carrera con resumen.
#   - 5 partidos efectivos consumidos vía post-match (no asssertVisible
#     temporada-screen sin haber pasado por post-match).
#   - Termina en /simulador-carrera/fin-carrera con stage='retirement'.
#
# Diferencias vs MGC-1872 (4 sept):
#   - input-lastname ahora REQUIRED (PR #427).
#   - Chips pos-{GK|CB|CAM|ST}; carrera A usa pos-ST explícito.
#   - btn-dashboard-academy bifurca: sin club → /academy; con club → /match
#     (PR #421 WF4). Debut match ocurre ANTES de draft, no durante.
#   - club-${id} en academy.tsx; club-pick-${id} en club.tsx (MGC-209 [4/6]).
#   - btn-dashboard-draft visible mientras !profile.club OR stage==='clubStart'
#     (NO por semana N como предполагал el issue original — ver comment MGC-1786).
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   adb shell pm clear com.mgcstudios.copero
#   maestro test .maestro/f33-walk-carrera-a-agresiva.yaml
#
# Owner del device: QA agent (ZY22G728HN). CI no corre Maestro mobile.

appId: com.mgcstudios.copero
name: f33-walk-carrera-a-agresiva
tags:
  - career
  - f3.3
  - walk
  - mgc-1786
  - mgc-1633
  - carrera-a
  - agresiva

---
# ── SETUP: home → identity (4 campos post-PR #427) ───────────────────
- launchApp:
    appId: com.mgcstudios.copero
    clearState: true

- assertVisible:
    id: home-screen
    label: "Home con CTA Jugar visible"
- assertVisible:
    id: btn-career
    label: "CTA Jugar presente"
- tapOn:
    id: btn-career
    label: "Tap Jugar → /identity"

- assertVisible:
    id: identity-screen
    label: "Pantalla identity montada"
- scrollUntilVisible:
    element:
      id: input-name
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-name
    text: "Mateo F33A"
- scrollUntilVisible:
    element:
      id: input-lastname
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-lastname
    text: "Agresiva"
- scrollUntilVisible:
    element:
      id: country-ARG
    direction: DOWN
    timeout: 5000
- tapOn:
    id: country-ARG
    label: "País Argentina"
# Carrera A agresiva: posición ST (delantero centro). Chips pos-{id}.
- scrollUntilVisible:
    element:
      id: pos-ST
    direction: DOWN
    timeout: 5000
- tapOn:
    id: pos-ST
    label: "Posición ST (delantero)"
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-identity-continue
    label: "Continuar → /dashboard"

# ── DASHBOARD 1ª vez (sin club) → ACADEMY → CLUB velez ──────────────
- assertVisible:
    id: dashboard-screen
    label: "Dashboard post-identity"
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy
    label: "Dashboard → /academy"

- assertVisible:
    id: academy-screen
    label: "Pantalla academy"
- scrollUntilVisible:
    element:
      id: club-velez
    direction: DOWN
    timeout: 5000
- tapOn:
    id: club-velez
    label: "Pick Vélez (1ª fichaje, academy)"
- assertVisible:
    text: "Firmar"
- tapOn:
    text: "Firmar"
- waitForAnimationToEnd

# ── DEBUT MATCH (PR #421 WF4) ────────────────────────────────────────
# Con club fichado, btn-dashboard-academy bifurca a /match vía startMatch().
- assertVisible:
    id: dashboard-screen
    label: "Dashboard post-firma"
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy
    label: "Dashboard → /match (debut)"

- assertVisible:
    id: match-screen
    label: "Match debut"
- assertVisible:
    id: match-scoreboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: btn-match-finalize
    direction: DOWN
    timeout: 10000
- tapOn:
    id: btn-match-finalize
    label: "Finalizar → /post-match"

# ── POST-MATCH (PR #421 WF5) ─────────────────────────────────────────
- assertVisible:
    id: post-match-screen
    label: "Post-match debut"
- assertVisible:
    id: post-match-rating
- scrollUntilVisible:
    element:
      id: btn-post-match-next-week
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-post-match-next-week
    label: "Siguiente semana → /dashboard"

# ── DRAFT (MGC-209 [3/6], btn-dashboard-draft visible por stage='clubStart')
- assertVisible:
    id: dashboard-screen
    label: "Dashboard post-debut (con club)"
- scrollUntilVisible:
    element:
      id: btn-dashboard-draft
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-draft
    label: "Dashboard → /draft"

- assertVisible:
    id: draft-screen
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-draft-confirm
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-draft-confirm
      - waitForAnimationToEnd

# ── TU-JUGADOR → CLUB final (MGC-209 [4/6]) ──────────────────────────
- assertVisible:
    id: tu-jugador-screen
- scrollUntilVisible:
    element:
      id: btn-tu-jugador-club
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-tu-jugador-club
    label: "Tu jugador → /club"

- assertVisible:
    id: club-pick-velez
    label: "Club final Vélez"
- tapOn:
    id: club-pick-velez
    label: "Pick Vélez (club final)"
- waitForAnimationToEnd

# ── TEMPORADA: 5 temporadas agresivas (doble_turno) ──────────────────
- assertVisible:
    id: temporada-screen
- repeat:
    times: 5
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-play
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-play
          label: "Temporada → /season-hub"
      - assertVisible:
          id: season-hub-scroll
      - scrollUntilVisible:
          element:
            id: btn-season-hub-decide
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-decide
          label: "Hub → /week-decision"
      - assertVisible:
          id: week-decision-scroll
      - scrollUntilVisible:
          element:
            id: btn-week-option-doble_turno
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-week-option-doble_turno
          label: "Pick doble_turno (resuelve partido)"
      - waitForAnimationToEnd
      - assertVisible:
          id: season-hub-scroll
      - scrollUntilVisible:
          element:
            id: btn-season-hub-view-table
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-view-table
          label: "Volver a /temporada"
      - waitForAnimationToEnd

# ── FIN-CARRERA forzado (avanzar 4 semanas + retire manual) ──────────
- assertVisible:
    id: temporada-screen
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-next-week
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-next-week
      - waitForAnimationToEnd
- assertVisible:
    id: temporada-last-season
- scrollUntilVisible:
    element:
      id: btn-temporada-retire
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-temporada-retire
    label: "Retiro manual → /fin-carrera"
- waitForAnimationToEnd

# ── FIN-CARRERA ──────────────────────────────────────────────────────
- assertVisible:
    id: fin-carrera-screen
    label: "Pantalla fin-carrera con resumen"
# Resumen puede ser retire.summary (larga, 5+ temporadas) o
# retire.notFinished (corta, motor decidió fin anticipado). Carrera A
# agresiva target = retire.summary.
- assertVisible:
    text: "Resumen"
    label: "Resumen de carrera visible"
