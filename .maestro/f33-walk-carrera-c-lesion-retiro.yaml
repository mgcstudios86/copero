# MGC-1786 / MGC-1633 — F3.3 Walk carrera-c lesión + retiro.
#
# Walk regresivo: fuerza lesión temprana vía entrenamiento_fisico_especifico
# agresivo y valida que el motor cierra la carrera correctamente cuando
# `lesion.fechasOut > 0` cruza el threshold. PR-418 (MGC-1677) preserva
# `fechasOut` semanas tras reinjury; este walk valida que el reinjury
# stack no rompe fin-carrera.
#
# Precondiciones: idénticas a f33-walk-carrera-a-agresiva.yaml.
#
# AC (MGC-1786 AC actualizado):
#   - Carrera C: setup (identity con input-lastname + pos-ST + club
#     temperley arquetipo DESARROLLO) → debut match → draft →
#     club final (temperley) → loop 4 temporadas con
#     entrenamiento_fisico_especifico agresivo buscando forzar lesión
#     → fin-carrera disparado por lesión (no edad).
#   - El flujo termina en /fin-carrera con retire.summary o
#     retire.notFinished.
#   - Sin assertVisible fallando — el reinjury stack no rompe la nav.
#
# Notas:
#   - Temperley está en 2da posición del academy (debajo del fold).
#   - `btn-week-option-entrenamiento_fisico_especifico` es el camino de
#     mayor riesgo de lesión. Carrera C lo usa 100%.
#   - Si el motor detecta fechasOut > threshold y cierra la carrera, el flow
#     assertVisible fin-carrera-screen sin necesidad del
#     btn-temporada-retire manual.
#   - post-match-rating debe mostrar fatigue/moral baja antes del retiro
#     por lesión. El flow assertVisible post-match-rating y post-match-deltas
#     en la primera iteración para evidenciar regresión.
#   - PR #414 (808a534) agregó stat posicional dinámico a
#     entrenamiento_fisico_especifico — carrera C lo verifica implícitamente
#     al elegir ST como posición inicial.

appId: com.mgcstudios.copero
name: f33-walk-carrera-c-lesion-retiro
tags:
  - career
  - f3.3
  - walk
  - mgc-1786
  - mgc-1633
  - carrera-c
  - lesion
  - retiro

---
- launchApp:
    appId: com.mgcstudios.copero
    clearState: true

- assertVisible:
    id: home-screen
- tapOn:
    id: btn-career

- assertVisible:
    id: identity-screen
- scrollUntilVisible:
    element:
      id: input-name
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-name
    text: "Mateo F33C"
- scrollUntilVisible:
    element:
      id: input-lastname
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-lastname
    text: "Lesion"
- scrollUntilVisible:
    element:
      id: country-ARG
    direction: DOWN
    timeout: 5000
- tapOn:
    id: country-ARG
# Carrera C lesión: posición ST (PR #414 entrega stat posicional dinámico).
- scrollUntilVisible:
    element:
      id: pos-ST
    direction: DOWN
    timeout: 5000
- tapOn:
    id: pos-ST
    label: "Posición ST (delantero)"
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-identity-continue

- assertVisible:
    id: dashboard-screen
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy

- assertVisible:
    id: academy-screen
# Temperley (DESARROLLO) está en 2da posición del fold.
- scrollUntilVisible:
    element:
      text: "TEMPERLEY"
    direction: DOWN
    timeout: 5000
- scrollUntilVisible:
    element:
      id: club-temperley
    direction: DOWN
    timeout: 5000
- tapOn:
    id: club-temperley
    label: "Pick Temperley (arquetipo DESARROLLO)"
- assertVisible:
    text: "Firmar"
- tapOn:
    text: "Firmar"
- waitForAnimationToEnd

# ── DEBUT MATCH ──────────────────────────────────────────────────────
- assertVisible:
    id: dashboard-screen
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy
    label: "Dashboard → /match (debut)"

- assertVisible:
    id: match-screen
- assertVisible:
    id: match-scoreboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: btn-match-finalize
    direction: DOWN
    timeout: 10000
- tapOn:
    id: btn-match-finalize

- assertVisible:
    id: post-match-screen
- scrollUntilVisible:
    element:
      id: btn-post-match-next-week
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-post-match-next-week

# ── DRAFT → TU-JUGADOR → CLUB final temperley ───────────────────────
- assertVisible:
    id: dashboard-screen
- scrollUntilVisible:
    element:
      id: btn-dashboard-draft
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-draft

- assertVisible:
    id: draft-screen
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-draft-confirm
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-draft-confirm
      - waitForAnimationToEnd

- assertVisible:
    id: tu-jugador-screen
- scrollUntilVisible:
    element:
      id: btn-tu-jugador-club
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-tu-jugador-club
    label: "Tu jugador → /club"

- assertVisible:
    id: club-pick-temperley
    label: "Club final Temperley"
- tapOn:
    id: club-pick-temperley
    label: "Pick Temperley (club final)"
- waitForAnimationToEnd

# ── TEMPORADA: 4 temporadas con entrenamiento_fisico_especifico agresivo
#    para forzar lesión temprana y validar fin-carrera por injury. ──────
- assertVisible:
    id: temporada-screen
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-play
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-play
      - assertVisible:
          id: season-hub-scroll
      - scrollUntilVisible:
          element:
            id: btn-season-hub-decide
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-decide
      - assertVisible:
          id: week-decision-scroll
      - scrollUntilVisible:
          element:
            id: btn-week-option-entrenamiento_fisico_especifico
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-week-option-entrenamiento_fisico_especifico
          label: "Pick training (alto riesgo lesión)"
      - waitForAnimationToEnd
      # Si lesión cierra carrera, assertVisible fin-carrera-screen y break.
      - runFlow:
          when:
            visible:
              id: fin-carrera-screen
          commands:
            - assertVisible:
                text: "Resumen"
                label: "Carrera cerrada por lesión"
            - stopApp
      - assertVisible:
          id: season-hub-scroll
      - scrollUntilVisible:
          element:
            id: btn-season-hub-view-table
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-view-table
      - waitForAnimationToEnd

# ── FIN-CARRERA forzado (carrera no se cerró por lesión) ──────────────
- assertVisible:
    id: temporada-screen
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-next-week
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-next-week
      - waitForAnimationToEnd
- assertVisible:
    id: temporada-last-season
- scrollUntilVisible:
    element:
      id: btn-temporada-retire
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-temporada-retire
    waitForAnimationToEnd

# ── FIN-CARRERA ──────────────────────────────────────────────────────
- assertVisible:
    id: fin-carrera-screen
- assertVisible:
    text: "Resumen"
