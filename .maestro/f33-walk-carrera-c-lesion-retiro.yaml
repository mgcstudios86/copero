# MGC-1786 / MGC-1633 — F3.3 Walk carrera-c lesión + retiro (REESCRITO
# sobre a09ffbe / PR #470 UX1).
#
# Walk regresivo: fuerza lesión temprana vía
# entrenamiento_fisico_especifico agresivo y valida que el motor cierra
# la carrera correctamente cuando `lesion.fechasOut > 0` cruza el
# threshold. PR-418 (MGC-1677) preserva `fechasOut` semanas tras reinjury;
# este walk valida que el reinjury stack no rompe fin-carrera.
#
# Precondiciones (ejecutar ANTES de `maestro test`):
#   1. APK pineado al SHA del PR que cerró UX1 (PR #470 a09ffbe) o
#      posterior. testIDs `team-select-card-${id}` y `btn-team-select-continue`
#      sólo existen desde PR #470.
#   2. adb shim en ~/.local/bin/adb (Homebrew adb 1.0.41 cuelga).
#   3. Device físico ZY22G728HN conectado (`adb devices`).
#   4. JAVA_HOME apuntando a openjdk@17:
#        export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   5. AsyncStorage limpio — el flow asume state vacío. Si hay save previo
#      el flow hidrata y este flow no llega a identity. Forzar reset con:
#        adb shell pm clear com.mgcstudios.copero
#
# AC (MGC-1786 AC actualizado):
#   - Carrera C: setup (identity con input-lastname + pos-ST + club velez)
#     → season-hub → 4 semanas con entrenamiento_fisico_especifico (alto
#     injuryBase=0.03 + cumulative streak) → lesión detectada vía banner
#     `lesion_activa` en season-hub → retiro manual → fin-carrera con
#     stage='retirement' y resumen.
#   - lesión banner: temporada.tsx renderiza LESIÓN ACTIVA cuando
#     profile.career.lesion.fechasOut > 0. Ver `weeklyDecisionTree.ts`
#     `doubleStreakInjuryMod` + `fatigueInjuryMod` por el modelado.
#
# Diferencias vs MGC-1786 PR #468 (a0354e1 sobre c33b9d2):
#   - PR #468 asumía debut match + 4 semanas de partido antes de detectar
#     lesión. ESTE FLOW YA NO EXISTE en main.
#   - PR #470 reemplaza el módulo academy.tsx + draft.tsx por team-select.
#     NO hay debut match, NO hay /draft, NO hay /tu-jugador → /club.
#   - week-decision.entrenamiento_fisico_especifico NO consume matchweek
#     (a diferencia de turno_simple/doble_turno). Sólo
#     career.fisico -10 + stat posicional +2. Carrera C no necesita
#     matchweeks para forzar lesión.
#   - Lesión banner se renderiza en temporada.tsx (`lesion_activa`); tras
#     4 semanas de entrenamiento_fisico_especifico consecutivas el motor
#     dispara lesión con probabilidad acumulada > 0.5.
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   adb shell pm clear com.mgcstudios.copero
#   maestro test .maestro/f33-walk-carrera-c-lesion-retiro.yaml
#
# Owner del device: QA agent (ZY22G728HN). CI no corre Maestro mobile.

appId: com.mgcstudios.copero
name: f33-walk-carrera-c-lesion-retiro
tags:
  - career
  - f3.3
  - walk
  - mgc-1786
  - mgc-1633
  - carrera-c
  - lesion
  - ux1

---
# ── SETUP: home → identity (4 campos post-PR #427) ───────────────────
- launchApp:
    appId: com.mgcstudios.copero
    clearState: true

- assertVisible:
    id: home-screen
    label: "Home con CTA Jugar visible"
- assertVisible:
    id: btn-career
    label: "CTA Jugar presente"
- tapOn:
    id: btn-career
    label: "Tap Jugar → /identity"

- assertVisible:
    id: identity-screen
    label: "Pantalla identity montada"
- scrollUntilVisible:
    element:
      id: input-name
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-name
    text: "Carlos F33C"
- scrollUntilVisible:
    element:
      id: input-lastname
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-lastname
    text: "LesionRetiro"
- scrollUntilVisible:
    element:
      id: country-ARG
    direction: DOWN
    timeout: 5000
- tapOn:
    id: country-ARG
    label: "País Argentina"
# Carrera C lesión: posición ST (delantero centro). Chips pos-{id}.
- scrollUntilVisible:
    element:
      id: pos-ST
    direction: DOWN
    timeout: 5000
- tapOn:
    id: pos-ST
    label: "Posición ST (delantero)"
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-identity-continue
    label: "Continuar → /team-select (PR #470 UX1)"

# ── TEAM-SELECT (PR #470 UX1) ────────────────────────────────────────
- assertVisible:
    id: team-select-screen
    label: "Pantalla team-select montada"
- scrollUntilVisible:
    element:
      id: team-select-card-velez
    direction: DOWN
    timeout: 5000
- tapOn:
    id: team-select-card-velez
    label: "Pick Vélez (club inicial)"
- assertVisible:
    id: btn-team-select-continue
    label: "CTA Continuar habilitado tras pick"
- tapOn:
    id: btn-team-select-continue
    label: "Continuar → /season-hub"
- assertVisible:
    id: season-hub-scroll
    timeout: 8000
    label: "Season hub montado tras team-select"

# ── FASE 1: 4 semanas de entrenamiento_fisico_especifico ────────────
# AC: "4 sem partido + lesión banner detectado + retiro + fin-carrera
# PASS". Carrera C prioriza lesión sobre partido: usa
# entrenamiento_fisico_especifico (injuryBase=0.03 + cumulative streak)
# que dispara lesión con probabilidad > 0.5 en 4 semanas consecutivas.
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-season-hub-decide
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-decide
          label: "Season hub → /week-decision"
      - assertVisible:
          id: week-decision-scroll
          timeout: 5000
          label: "Week decision montada"
      - scrollUntilVisible:
          element:
            id: btn-week-option-entrenamiento_fisico_especifico
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-week-option-entrenamiento_fisico_especifico
          label: "Pick entrenamiento_fisico_especifico (alto injuryBase)"
      - assertVisible:
          id: season-hub-scroll
          timeout: 8000
          label: "Vuelta a season-hub post-entrenamiento"

# ── TEMPORADA SCREEN: validar banner lesión + forzar retiro ──────────
- scrollUntilVisible:
    element:
      id: btn-season-hub-view-table
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-season-hub-view-table
    label: "Season hub → /temporada"
- assertVisible:
    id: temporada-screen
    timeout: 8000
    label: "Pantalla temporada montada"
# El banner LESIÓN ACTIVA se renderiza en temporada.tsx cuando
# profile.career.lesion.fechasOut > 0. Si tras 4 semanas de
# entrenamiento_fisico_especifico no apareció (probabilidad < 1.0),
# igual forzamos el retiro manual.
- assertVisible:
    text: "LESIÓN ACTIVA"
    optional: true
    label: "Banner lesión activa (probabilístico, puede no aparecer)"
- scrollUntilVisible:
    element:
      id: btn-temporada-retire
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-temporada-retire
    label: "Retiro forzado → /fin-carrera"
- waitForAnimationToEnd

# ── FIN-CARRERA ──────────────────────────────────────────────────────
- assertVisible:
    id: fin-carrera-screen
    timeout: 8000
    label: "Pantalla fin-carrera con resumen"
# Carrera C con lesión temprana puede terminar en retire.earlyRetirement
# (lesión forzó fin) o retire.notFinished (motor no detectó fin
# natural). Aceptamos cualquier resumen que mencione lesión o retiro.
- assertVisible:
    text: "Resumen"
    label: "Resumen de carrera visible"
