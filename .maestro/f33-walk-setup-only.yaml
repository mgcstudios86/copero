# MGC-1786 — F3.3 Walk setup-only.
#
# Recorre el setup completo desde home hasta la pantalla /club, dejando la
# carrera lista para que el flow carrera-{a,b,c} elija el club final y
# arranque la temporada. NO incluye loop temporada ni fin-carrera.
#
# Arquitectura (main @ c33b9d2, post-PR #427 WF1 identidad + chips +
# apellido + PR #421 WF4 partido+post-match + PR #438/PR #466 F4 social +
# draft MGC-209):
#
#   home (btn-career)
#     → /identity  (identity-screen; input-name, input-lastname,
#                    country-ARG, pos-{GK|CB|CAM|ST}, btn-identity-continue)
#     → /dashboard (dashboard-screen; btn-dashboard-academy +
#                    btn-dashboard-draft; showDraftCta = !profile.club ||
#                    stage === 'clubStart')
#     → /academy   (academy-screen; club-${club.id}; Alert "Firmar")
#     → /dashboard (con profile.club + stage='clubStart')
#     → /match     (match-screen; btn-match-finalize; startMatch())
#     → /post-match (post-match-screen; btn-post-match-next-week +
#                    btn-post-match-back-hub → ambos router.replace a
#                    /dashboard por PR-421 WF5)
#     → /dashboard (post-match drain vía matchStore + clearPostMatch)
#     → /draft     (draft-screen; 4 rondas btn-draft-confirm; startDraft)
#     → /tu-jugador (tu-jugador-screen; btn-tu-jugador-club → /club)
#     → /club      (MGC-209 [4/6] ELEGÍ TU CLUB; club-pick-${club.id})
#     → [carrera-* toma control: club-pick-{velez|boca|temperley} +
#        /temporada]
#
# Precondiciones (ejecutar ANTES de maestro test):
#   1. APK pineado al SHA del PR que cerró F3.2 motor (PR #425 c45c64c)
#      o posterior — testIDs estables desde PR #421.
#   2. adb shim en ~/.local/bin/adb (Homebrew adb 1.0.41 cuelga).
#   3. Device físico ZY22G728HN conectado (`adb devices`).
#   4. JAVA_HOME apuntando a openjdk@17:
#        export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   5. AsyncStorage limpio (reset completo):
#        adb shell pm clear com.mgcstudios.copero
#   6. App en frío (launchApp con clearState=false deja el state pre-poblado
#      por el deeplink; usar clearState=true si querés reset duro).
#
# AC:
#   - Llega a /club con `club-${club.id}` visible en la grilla.
#   - Ningún assertVisible fallando durante setup.
#   - Logs `/tmp/maestro-setup-debug/` con dumps intermedios.
#
# Diferencias vs flujos viejos (MGC-1872 / 4 sept):
#   - `input-lastname` ahora es REQUIRED (PR #427). Antes era opcional.
#   - Chips `pos-${chip.id}` pos-GK|CB|CAM|ST (4 visibles, no 6).
#   - `btn-dashboard-academy` con club → /match (PR #421) — antes abría
#     academy siempre. Ahora bifurca en onAcademyPress según profile.club.
#   - `btn-dashboard-draft` se muestra cuando !profile.club OR
#     stage==='clubStart'. NO depende de la semana (MGC-1786 issue
#     describía "umbral semana N" pero el código real es por estado).
#   - `club-${club.id}` en academy.tsx; `club-pick-${club.id}` en club.tsx
#     (MGC-209 [4/6]). Dos testIDs distintos, no son el mismo botón.
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   adb shell pm clear com.mgcstudios.copero
#   maestro test .maestro/f33-walk-setup-only.yaml

appId: com.mgcstudios.copero
name: f33-walk-setup-only
tags:
  - career
  - f3.3
  - walk
  - mgc-1786
  - mgc-1633
  - setup

---
# ── HOME ──────────────────────────────────────────────────────────────
- launchApp:
    appId: com.mgcstudios.copero
    clearState: true

- assertVisible:
    id: home-screen
    label: "Home con CTA Jugar"
- assertVisible:
    id: btn-career
    label: "CTA Jugar presente"
- tapOn:
    id: btn-career
    label: "Tap Jugar → /identity"

# ── IDENTITY (PR #427 — 4 campos: nombre, apellido, país, posición) ───
- assertVisible:
    id: identity-screen
    label: "Pantalla identity montada"
- scrollUntilVisible:
    element:
      id: input-name
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-name
    text: "Walk Setup"
- scrollUntilVisible:
    element:
      id: input-lastname
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-lastname
    text: "F33"
# País AR (Argentina) — default; el flow carrera puede parametrizar.
- scrollUntilVisible:
    element:
      id: country-ARG
    direction: DOWN
    timeout: 5000
- tapOn:
    id: country-ARG
    label: "País Argentina"
# Posición default CAM (MID central). Chips visibles: pos-GK, pos-CB,
# pos-CAM, pos-ST. PR #420 vc=109 recortó pos-RW/pos-RB por P0-2.
- scrollUntilVisible:
    element:
      id: pos-CAM
    direction: DOWN
    timeout: 5000
- tapOn:
    id: pos-CAM
    label: "Posición CAM (default)"
# Edad 18 / Número 9 quedan en default (stepper +/- + slider, no input).
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-identity-continue
    label: "Continuar → /dashboard"

# ── DASHBOARD (1ª vez, sin club) ─────────────────────────────────────
- assertVisible:
    id: dashboard-screen
    label: "Dashboard post-identity"
# Path canónico: academy → club pick → "Firmar" → dashboard (con club).
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy
    label: "Dashboard → /academy"

# ── ACADEMY → CLUB (testID `club-${club.id}`, NO `club-pick-`) ───────
- assertVisible:
    id: academy-screen
    label: "Pantalla academy"
- scrollUntilVisible:
    element:
      id: club-velez
    direction: DOWN
    timeout: 5000
- tapOn:
    id: club-velez
    label: "Pick Vélez (default setup)"
- assertVisible:
    text: "Firmar"
- tapOn:
    text: "Firmar"
- waitForAnimationToEnd

# ── DASHBOARD post-firma (con club, stage='clubStart') ────────────────
- assertVisible:
    id: dashboard-screen
    label: "Dashboard con club fichado"
# Debut match: btn-dashboard-academy bifurca a /match ahora que hay club.
# (PR #421 WF4 partido + WF5 post-match).
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy
    label: "Dashboard → /match (debut, con club)"

# ── MATCH (debut) ─────────────────────────────────────────────────────
- assertVisible:
    id: match-screen
    label: "Match screen"
- assertVisible:
    id: match-scoreboard
    label: "Scoreboard visible"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: btn-match-finalize
    direction: DOWN
    timeout: 10000
- tapOn:
    id: btn-match-finalize
    label: "Finalizar debut match → /post-match"

# ── POST-MATCH ────────────────────────────────────────────────────────
- assertVisible:
    id: post-match-screen
    label: "Pantalla post-match"
- assertVisible:
    id: post-match-rating
    label: "Rating post-match visible"
- scrollUntilVisible:
    element:
      id: btn-post-match-next-week
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-post-match-next-week
    label: "Siguiente semana → /dashboard"

# ── DASHBOARD post-debut (sigue con club + stage='clubStart') ────────
- assertVisible:
    id: dashboard-screen
    label: "Dashboard post-debut"
# Draft module (MGC-209 [3/6]): 4 rondas de pick/swap.
- scrollUntilVisible:
    element:
      id: btn-dashboard-draft
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-draft
    label: "Dashboard → /draft"

# ── DRAFT (4 rondas confirm) ──────────────────────────────────────────
- assertVisible:
    id: draft-screen
    label: "Draft screen"
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-draft-confirm
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-draft-confirm
      - waitForAnimationToEnd

# ── TU-JUGADOR → CLUB (MGC-209 [4/6]) ────────────────────────────────
- assertVisible:
    id: tu-jugador-screen
    label: "Tu jugador screen"
- scrollUntilVisible:
    element:
      id: btn-tu-jugador-club
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-tu-jugador-club
    label: "Tu jugador → /club"

# ── CLUB screen ──────────────────────────────────────────────────────
- assertVisible:
    id: club-pick-velez
    label: "Club Vélez visible en grilla"
# El flow carrera-* toma el control desde acá con `runFlow` o continúa
# inline con `club-pick-${carreraClub}`.
