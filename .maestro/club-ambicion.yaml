# MGC-221 + MGC-217 — Club screen: AMBICIÓN (Boca Juniors) happy path.
#
# Precondiciones (ejecutar ANTES de `maestro test`):
#   1. APK instalado: build-138-preview-6422e8e.apk
#   2. adb disponible (shim ~/.local/bin/adb si Homebrew adb está colgado).
#   3. Device físico ZY22G728HN conectado (`adb devices`).
#   4. JAVA_HOME apuntando a openjdk@17 (Maestro no resuelve el java del PATH
#      del sistema):
#        export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   5. Deep link a la pantalla club vía adb (launchApp + openLink dentro de
#      Maestro NO navegan en device físico):
#        adb shell am start -a android.intent.action.VIEW \
#          -d copero://simulador-carrera/club com.mgcstudios.copero
#
# AC MGC-217:
#   - 4 tarjetas visibles: Vélez=EQUILIBRIO, Temperley=DESARROLLO,
#     Morón=DESARROLLO, Boca=AMBICIÓN.
#   - Tap "Firmar con Boca Juniors" -> motor aplica bonuses AMBICIÓN.
#   - Sin regresión: las otras 3 tarjetas siguen renderizando
#     correctamente (verificamos su presencia, no su selección).
#
# Notas de implementación (MGC-223):
#   - Sin `launchApp`: el deep link arriba deja la pantalla club visible.
#   - Nombres en MAYÚSCULAS: la UI renderiza los nombres de los clubes en
#     uppercase vía `textTransform: 'uppercase'`. Mezcla de mayúsculas/minúsculas
#     en los assert falla.
#   - `scrollUntilVisible`: la lista de tarjetas es scrolleable. Sólo Vélez
#     entra en el viewport inicial. Hay que scrollear para Temperley,
#     Morón y Boca Juniors.
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   adb shell am start -a android.intent.action.VIEW \
#     -d copero://simulador-carrera/club com.mgcstudios.copero
#   maestro test .maestro/club-ambicion.yaml
#
# Owner del device: QA agent (ZY22G728HN). CI no corre Maestro mobile.

appId: com.mgcstudios.copero
name: club-ambicion
tags:
  - club
  - career
  - mgc-217
  - mgc-221
  - mgc-223
  - happy-path

---
# Precondición: la pantalla club ya está visible gracias al deep link adb
# ejecutado antes de este flow. No usamos `launchApp` porque abre la app en
# la pantalla home y `openLink` dentro de Maestro no navega en device físico.

- assertVisible:
    id: club-screen
    label: "Pantalla de selección de club visible"

# Tarjeta 1: Vélez Sarsfield (visible en viewport inicial).
- assertVisible:
    text: "EQUILIBRIO"
    label: "Arquetipo EQUILIBRIO presente (Vélez)"
- assertVisible:
    text: "VÉLEZ SARSFIELD"
    label: "Tarjeta Vélez Sarsfield presente"

# Tarjeta 2: Temperley (debajo del fold).
- scrollUntilVisible:
    element:
      text: "TEMPERLEY"
    direction: DOWN
    label: "Scroll hasta ver Temperley"
- assertVisible:
    text: "DESARROLLO"
    label: "Arquetipo DESARROLLO presente (Temperley)"

# Tarjeta 3: Morón (debajo del fold).
- scrollUntilVisible:
    element:
      text: "MORÓN"
    direction: DOWN
    label: "Scroll hasta ver Morón"

# Tarjeta 4: Boca Juniors (debajo del fold; objetivo del happy path).
- scrollUntilVisible:
    element:
      text: "BOCA JUNIORS"
    direction: DOWN
    label: "Scroll hasta ver Boca Juniors"
- assertVisible:
    text: "AMBICIÓN"
    label: "Arquetipo AMBICIÓN presente (Boca Juniors)"

# Botón de firma debe estar visible antes de tocar.
- assertVisible:
    id: club-pick-boca
    label: "Botón Firmar con Boca Juniors visible"

# Tap en Boca Juniors — ruta a /simulador-carrera/temporada.
- tapOn:
    id: club-pick-boca
    label: "Firmar con Boca Juniors"

# Verificación post-firma: la pantalla club ya no debe estar visible
# y la pantalla de temporada debe haber cargado.
- assertNotVisible:
    id: club-screen
    label: "Pantalla club cerrada tras la firma"
- assertVisible:
    text: "Temporada"
    label: "Pantalla temporada abierta"
