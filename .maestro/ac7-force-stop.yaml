# MGC-421 AC7 — flow Maestro E2E post force-stop.
#
# Reproduce el escenario exacto que 5 PRs previos (MGC-262/273/284/311
# + MGC-306) no cerraron: instalar APK limpio, jugar hasta fin-carrera
# (stage='retirement'), force-stop del proceso vía adb, relaunch, y
# asertar que la home hidrata con el último snapshot persistido y
# muestra el CTA "Continuar" (resume).
#
# AC:
#   1. Tap "Jugar" -> identity -> dashboard -> academy -> club ->
#      dashboard -> draft (8 rondas) -> temporada (avanzar hasta
#      retiro) -> pantalla retirement.
#   2. Force-stop del proceso (adb shell am force-stop).
#   3. Relaunch app. La home debe mostrar:
#      - jersey con nombre del jugador.
#      - OVR final (no guion).
#      - CTA "Continuar" (resume CTA post-relaunch).
#
# Precondiciones (idénticas a club-ambicion.yaml):
#   1. APK instalado: build-<PR>-<versionCode>-<shortSHA>.apk
#   2. adb shim en ~/.local/bin/adb.
#   3. Device físico ZY22G728HN conectado.
#   4. JAVA_HOME apuntando a openjdk@17.
#   5. AsyncStorage limpio (sin save previo) — el flow empieza en
#      identity vacío. Si la app tiene un save de una sesión previa,
#      MGC-227 lo hidrata y el flow no llega a la pantalla identity.
#      Para forzar estado limpio, ejecutar antes:
#        adb shell pm clear com.mgcstudios.copero
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   adb shell pm clear com.mgcstudios.copero
#   maestro test .maestro/ac7-force-stop.yaml
#
# Wire-up CI (MGC-421 AC7 gate): el step en .github/workflows/eas.yml
# `qa-ac7-force-stop` corre este flow sobre el APK built por el job
# `preview-android` cuando el runner tiene label `copero-ci-android-device`
# (no wired todavía — la primera ejecución debe hacerla QA en el
# host del device).

appId: com.mgcstudios.copero
name: ac7-force-stop
tags:
  - career
  - persistence
  - mgc-270
  - mgc-421
  - ac7
  - force-stop
  - regression

---
# AC7.1 — Tap "Jugar" en home.
- assertVisible:
    text: "Jugar"
- tapOn:
    text: "Jugar"

# AC7.2 — Pantalla identity: completar form.
- assertVisible:
    id: identity-screen
# MGC-1139: con Play Protect habilitado el viewport efectivo se reduce y
# input-name queda debajo del fold en cold-start. Hacemos scroll primero;
# si no hay ScrollView padre (caso MGC-969 architectural) Maestro completa
# el comando sin error.
- scrollUntilVisible:
    element:
      id: input-name
    direction: down
    timeout: 5000
- inputText:
    id: input-name
    text: "Mateo AC7"
# MGC-506: el `input-number` no es un TextInput nativo — es un stepper +/-.
# Reemplazamos inputText por tapOn en el botón + del stepper. El default
# del store ya es 9, así que 0 taps son suficientes; dejamos el id
# explícito para que QA vea la intención y pueda parametrizar el número.
- assertVisible:
    id: btn-number-plus
# MGC-1139: idem input-name — garantizar que el footer sticky con el
# stepper y Continue quede visible antes del tap (idempotente con Play
# Protect arriba o teclado in-app).
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: down
    timeout: 5000
- tapOn:
    id: btn-identity-continue

# AC7.3 — Pantalla dashboard post-identity: navegar a academy.
# MGC-553 / MGC-374 / MGC-399: la navegación directa identity -> academy
# se deprecó. El flow canónico post-identity es identity -> dashboard ->
# tap `btn-dashboard-academy` -> academy. El fix previo (PR #193/#194)
# asumió la ruta vieja y la AC7.3 fallaba con `assertVisible academy-screen`
# porque la app monta dashboard-screen. Inserto el paso intermedio aquí.
- assertVisible:
    id: dashboard-screen
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: down
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy

# AC7.4 — Pantalla academy: pick club (primera tarjeta = Vélez).
- assertVisible:
    id: academy-screen
- tapOn:
    id: club-velez

# Confirm Alert de "Fichar con Vélez".
- assertVisible:
    text: "Fichar por Vélez Sarsfield"
- tapOn:
    text: "Firmar"
- waitForAnimationToEnd

# AC7.5 — Dashboard (post-club-pick): navegar a draft.
- assertVisible:
    id: dashboard-screen
- tapOn:
    id: btn-dashboard-draft

# AC7.6 — Pantalla draft: 8 rondas pickLegend.
- assertVisible:
    id: draft-screen
- repeat:
    times: 8
    commands:
      - tapOn:
          id: btn-draft-confirm
      - waitForAnimationToEnd

# AC7.7 — Pantalla tu-jugador: confirmar que card fue generada con OVR.
- assertVisible:
    id: tu-jugador-screen
- assertVisible:
    text: "OVR"

# AC7.8 — Pantalla club (post-draft): pick club y avanzar a temporada.
- tapOn:
    id: club-pick-velez
- assertVisible:
    text: "Firmar"
- tapOn:
    text: "Firmar"
- waitForAnimationToEnd

# AC7.9 — Temporada: avanzar hasta retiro (8 seasons default).
- assertVisible:
    id: temporada-screen
- repeat:
    times: 8
    commands:
      - tapOn:
          id: btn-temporada-play
      - waitForAnimationToEnd

# AC7.10 — Pantalla retirement: confirmar que la última temporada
# disparó el cierre de loop. El snapshot persistido debe tener
# `stage: 'retirement'` para que el relaunch hidrate correctamente.
- assertVisible:
    id: temporada-last-season

# AC7.11 — Force-stop del proceso vía adb. Aquí es donde el bug
# histórico se manifestaba: un force-stop antes de que AsyncStorage
# confirmara el `setItem` perdía el snapshot. Con C1+C2+C3+C4 en
# el bridge, el snapshot ya está en disco.
- evalScript: ${output.adbShell = adb -s ZY22G728HN shell am force-stop com.mgcstudios.copero}
# evalScript adb es síncrono: cuando retorna, ADB ya confirmó el kill del proceso.
# No se requiere pausa adicional — la espera previa de 10s con `- wait:` es
# inválida en Maestro 2.x (top-level) y fue removida en MGC-502.

# AC7.12 — Relaunch. La app debe abrir en home con CTA "Continuar"
# (resume CTA post-relaunch con snapshot stage='retirement').
- launchApp:
    appId: com.mgcstudios.copero
    clearState: false
- assertVisible:
    text: "Continuar"
- assertVisible:
    text: "Mateo AC7"
- assertNotVisible:
    text: "OVR —"
- assertNotVisible:
    text: "OVR -"
