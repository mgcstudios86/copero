# MGC-490 — Selector 4 clubes en draft-complete (regresión MGC-249 / MGC-486).
#
# Cubre el flow completo: home → identity → draft 8 rondas → tu-jugador →
# tap "Elegir club de origen" → 4 clubes visibles (Boca/Temperley/Vélez/Morón)
# → tap "Firmar con Boca Juniors" → temporada.
#
# Bug regresivo reportado en MGC-486: el tap en "Elegir club de origen"
# saltaba la pantalla de 4 clubes y firmaba directo con Boca Juniors
# (auto-assign). El guard de MGC-490 en `club.tsx` ahora detecta el
# snapshot stale y redirige a /temporada; este test verifica el happy
# path nuevo: las 4 tarjetas son visibles antes de elegir.
#
# Precondiciones:
#   1. APK instalado en ZY22G728HN (com.mgcstudios.copero).
#   2. JAVA_HOME apuntando a openjdk@17 (Maestro).
#   3. AsyncStorage limpio (sin carrera persistida previa) — el flow
#      asume estado identity. Si hay sesión, agregar `tapOn: btn-career`
#      + reset manual antes.
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   maestro test .maestro/draft-complete-club.yaml
#
# Owner del device: QA agent (ZY22G728HN). CI no corre Maestro mobile.

appId: com.mgcstudios.copero
name: draft-complete-club
tags:
  - club
  - career
  - draft
  - mgc-249
  - mgc-486
  - mgc-490
  - regression
  - happy-path

---
# 1) Home → Jugar.
- assertVisible:
    id: btn-career
    label: "Botón Jugar visible en home"
- tapOn:
    id: btn-career
    label: "Tap Jugar"

# 2) Identity screen.
- assertVisible:
    id: identity-screen
    label: "Pantalla identidad visible"

# 3) Completar identidad mínima (QA provee `input-name` con texto + tap
# `btn-identity-continue`).
- inputText:
    id: input-name
    text: "Mateo MGC490"
    label: "Nombre del jugador"

# Hide soft keyboard (Maestro 2.x native command) para descartar
# foco del EditText antes del scroll. Reemplaza el tapOn identity-screen
# de PR #198, que solo tocaba el header pero no dismissaba el IME en
# Android (MGC-527).
- hideKeyboard
- waitForAnimationToEnd

# Scroll down to reveal continue button.
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    label: "Scroll identity-screen to continue button"

- tapOn:
    id: btn-identity-continue
    label: "Confirmar identidad"

# 4) Dashboard tras identity.
- assertVisible:
    id: dashboard-screen
    label: "Dashboard del jugador visible"

# 5) Scroll to draft CTA and tap.
- scrollUntilVisible:
    element:
      id: btn-dashboard-draft
    direction: DOWN
    label: "Scroll dashboard to draft button"
- tapOn:
    id: btn-dashboard-draft
    label: "Empezar draft de leyendas"

# 6) Draft screen — confirmar 8 picks con pacing >=5s (ver
#    copero-qa-draft-rapid-tap-rollback).
#
# MGC-549: tras tap `btn-draft-confirm` el label `RONDA N+1 DE 8` puede
# tardar >10s en re-renderizarse aunque `waitForAnimationToEnd` haya
# retornado (race entre fin de animación y commit del state de la
# siguiente ronda en el simulador). Reemplazamos `waitForAnimationToEnd`
# + `assertVisible` por `extendedWaitUntil` que polea específicamente
# el texto de la próxima ronda — wait determinístico sobre el estado
# del counter, no sobre el timing de la animación.
- assertVisible:
    id: draft-screen
    label: "Pantalla draft visible"
# Round 1 (inicial — sólo assert).
- assertVisible:
    text: "RONDA 1 DE 8"
    label: "Espera ronda 1"
# Round 2
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 1"
- extendedWaitUntil:
    visible:
      text: "RONDA 2 DE 8"
    timeout: 20000
    label: "Espera ronda 2 (extendedWaitUntil 20s)"
# Round 3
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 2"
- extendedWaitUntil:
    visible:
      text: "RONDA 3 DE 8"
    timeout: 20000
    label: "Espera ronda 3 (extendedWaitUntil 20s)"
# Round 4
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 3"
- extendedWaitUntil:
    visible:
      text: "RONDA 4 DE 8"
    timeout: 20000
    label: "Espera ronda 4 (extendedWaitUntil 20s)"
# Round 5
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 4"
- extendedWaitUntil:
    visible:
      text: "RONDA 5 DE 8"
    timeout: 20000
    label: "Espera ronda 5 (extendedWaitUntil 20s)"
# Round 6
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 5"
- extendedWaitUntil:
    visible:
      text: "RONDA 6 DE 8"
    timeout: 20000
    label: "Espera ronda 6 (extendedWaitUntil 20s)"
# Round 7
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 6"
- extendedWaitUntil:
    visible:
      text: "RONDA 7 DE 8"
    timeout: 20000
    label: "Espera ronda 7 (extendedWaitUntil 20s)"
# Round 8
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 7"
- extendedWaitUntil:
    visible:
      text: "RONDA 8 DE 8"
    timeout: 20000
    label: "Espera ronda 8 (extendedWaitUntil 20s)"
# Pick 8 + wait final del draft-complete.
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 8"
- extendedWaitUntil:
    notVisible:
      text: "RONDA 8 DE 8"
    timeout: 20000
    label: "Espera salida de RONDA 8 (post-draft-complete)"

# 7) Tu-jugador (post-draft).
- assertVisible:
    id: tu-jugador-screen
    label: "Pantalla tu-jugador (draft-complete) visible"

# 8) Tap "Elegir club de origen" → selector 4 clubes.
- tapOn:
    id: btn-tu-jugador-club
    label: "Elegir club de origen"

# 9) Pantalla club con 4 clubes visibles (MGC-249 spec).
# MGC-1195 T7: en ZY22G728HN 1080x2400 con ad-banner nativo arriba, Temperley
# y Morón pueden quedar bajo el fold del viewport visible (~2250px según
# bug MGC-832). Insertamos scrollUntilVisible antes de cada assert para
# garantizar que las 4 tarjetas entran en el viewport testeable.
- assertVisible:
    id: club-screen
    label: "Pantalla selector de club visible"
# MGC-832: Boca + Vélez quedan above-the-fold; Temperley + Morón quedan
# cubiertos por el ad-banner-native (bounds [0,2250][1080,2400] en
# ZY22G728HN 1080x2400). Maestro 2.x `assertVisible` no autoscroll,
# así que scrolleamos antes del assert de cada tarjeta oculta.
- assertVisible:
    text: "VÉLEZ SARSFIELD"
    label: "Tarjeta Vélez Sarsfield visible"
- assertVisible:
    text: "BOCA JUNIORS"
    label: "Tarjeta Boca Juniors visible"
- scrollUntilVisible:
    element:
      text: "TEMPERLEY"
    direction: DOWN
    timeout: 5000
    label: "Scroll club-screen a tarjeta Temperley"
- assertVisible:
    text: "TEMPERLEY"
    label: "Tarjeta Temperley visible"
- scrollUntilVisible:
    element:
      text: "MORÓN"
    direction: DOWN
    timeout: 5000
    label: "Scroll club-screen a tarjeta Morón"
- assertVisible:
    text: "MORÓN"
    label: "Tarjeta Morón visible"

# 10) Tap Boca → /temporada (NO auto-firmar antes del tap).
- tapOn:
    id: club-pick-boca
    label: "Firmar con Boca Juniors"

# 11) Temporada abierta, club-screen cerrada.
- assertNotVisible:
    id: club-screen
    label: "Pantalla club cerrada tras la firma"
- assertVisible:
    id: temporada-screen
    label: "Pantalla temporada abierta"