# MGC-490 — Selector 4 clubes en draft-complete (regresión MGC-249 / MGC-486).
#
# Cubre el flow completo: home → identity → draft 8 rondas → tu-jugador →
# tap "Elegir club de origen" → 4 clubes visibles (Boca/Temperley/Vélez/Morón)
# → tap "Firmar con Boca Juniors" → temporada.
#
# Bug regresivo reportado en MGC-486: el tap en "Elegir club de origen"
# saltaba la pantalla de 4 clubes y firmaba directo con Boca Juniors
# (auto-assign). El guard de MGC-490 en `club.tsx` ahora detecta el
# snapshot stale y redirige a /temporada; este test verifica el happy
# path nuevo: las 4 tarjetas son visibles antes de elegir.
#
# Precondiciones:
#   1. APK instalado en ZY22G728HN (com.mgcstudios.copero).
#   2. JAVA_HOME apuntando a openjdk@17 (Maestro).
#   3. AsyncStorage limpio (sin carrera persistida previa) — el flow
#      asume estado identity. Si hay sesión, agregar `tapOn: btn-career`
#      + reset manual antes.
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   maestro test .maestro/draft-complete-club.yaml
#
# Owner del device: QA agent (ZY22G728HN). CI no corre Maestro mobile.

appId: com.mgcstudios.copero
name: draft-complete-club
tags:
  - club
  - career
  - draft
  - mgc-249
  - mgc-486
  - mgc-490
  - regression
  - happy-path

---
# 1) Home → Jugar.
- assertVisible:
    id: btn-career
    label: "Botón Jugar visible en home"
- tapOn:
    id: btn-career
    label: "Tap Jugar"

# 2) Identity screen.
- assertVisible:
    id: identity-screen
    label: "Pantalla identidad visible"

# 3) Completar identidad mínima (QA provee `input-name` con texto + tap
# `btn-identity-continue`).
- inputText:
    id: input-name
    text: "Mateo MGC490"
    label: "Nombre del jugador"

# Tap identity-screen header to dismiss soft keyboard focus.
- tapOn:
    id: identity-screen
    label: "Dismiss keyboard focus"

# Scroll down to reveal continue button (also dismisses keyboard).
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    label: "Scroll identity-screen to continue button"

- tapOn:
    id: btn-identity-continue
    label: "Confirmar identidad"

# 4) Dashboard tras identity.
- assertVisible:
    id: dashboard-screen
    label: "Dashboard del jugador visible"

# 5) Scroll to draft CTA and tap.
- scrollUntilVisible:
    element:
      id: btn-dashboard-draft
    direction: DOWN
    label: "Scroll dashboard to draft button"
- tapOn:
    id: btn-dashboard-draft
    label: "Empezar draft de leyendas"

# 6) Draft screen — confirmar 8 picks con pacing >=5s (ver
#    copero-qa-draft-rapid-tap-rollback). Un assertVisible por
#    ronda fuerza la espera hasta que el counter cambie.
- assertVisible:
    id: draft-screen
    label: "Pantalla draft visible"
# Round 1
- assertVisible:
    text: "RONDA 1 DE 8"
    label: "Espera ronda 1"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 1"
- waitForAnimationToEnd
# Round 2
- assertVisible:
    text: "RONDA 2 DE 8"
    label: "Espera ronda 2"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 2"
- waitForAnimationToEnd
# Round 3
- assertVisible:
    text: "RONDA 3 DE 8"
    label: "Espera ronda 3"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 3"
- waitForAnimationToEnd
# Round 4
- assertVisible:
    text: "RONDA 4 DE 8"
    label: "Espera ronda 4"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 4"
- waitForAnimationToEnd
# Round 5
- assertVisible:
    text: "RONDA 5 DE 8"
    label: "Espera ronda 5"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 5"
- waitForAnimationToEnd
# Round 6
- assertVisible:
    text: "RONDA 6 DE 8"
    label: "Espera ronda 6"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 6"
- waitForAnimationToEnd
# Round 7
- assertVisible:
    text: "RONDA 7 DE 8"
    label: "Espera ronda 7"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 7"
- waitForAnimationToEnd
# Round 8
- assertVisible:
    text: "RONDA 8 DE 8"
    label: "Espera ronda 8"
- tapOn:
    id: btn-draft-confirm
    label: "Confirmar pick 8"
- waitForAnimationToEnd

# 7) Tu-jugador (post-draft).
- assertVisible:
    id: tu-jugador-screen
    label: "Pantalla tu-jugador (draft-complete) visible"

# 8) Tap "Elegir club de origen" → selector 4 clubes.
- tapOn:
    id: btn-tu-jugador-club
    label: "Elegir club de origen"

# 9) Pantalla club con 4 clubes visibles (MGC-249 spec).
- assertVisible:
    id: club-screen
    label: "Pantalla selector de club visible"
- assertVisible:
    text: "VÉLEZ SARSFIELD"
    label: "Tarjeta Vélez Sarsfield visible"
- assertVisible:
    text: "BOCA JUNIORS"
    label: "Tarjeta Boca Juniors visible"
- assertVisible:
    text: "TEMPERLEY"
    label: "Tarjeta Temperley visible"
- assertVisible:
    text: "MORÓN"
    label: "Tarjeta Morón visible"

# 10) Tap Boca → /temporada (NO auto-firmar antes del tap).
- tapOn:
    id: club-pick-boca
    label: "Firmar con Boca Juniors"

# 11) Temporada abierta, club-screen cerrada.
- assertNotVisible:
    id: club-screen
    label: "Pantalla club cerrada tras la firma"
- assertVisible:
    id: temporada-screen
    label: "Pantalla temporada abierta"