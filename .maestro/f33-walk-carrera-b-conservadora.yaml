# MGC-1786 / MGC-1633 — F3.3 Walk carrera-b conservadora.
#
# Carrera larga conservadora: turno_simple consistente, fatiga estable
# sobre 60%, fin-carrera por retiro natural (edad 35) o retire.notFinished.
# Walk F1.4-style: valida que el motor respeta descanso y no fuerza lesión.
#
# Precondiciones: idénticas a f33-walk-carrera-a-agresiva.yaml.
#
# AC (MGC-1786 AC actualizado):
#   - Carrera B: setup (identity con input-lastname + pos-CAM + club boca
#     arquetipo AMBICIÓN) → debut match → draft → club final (boca) →
#     loop conservador 6 temporadas (turno_simple + descanso intercalado)
#     → fin-carrera por retiro de edad.
#   - 6 partidos efectivos consumidos vía post-match.
#   - Termina en /simulador-carrera/fin-carrera.
#
# Notas:
#   - Boca Juniors requiere scroll en /academy (4 tarjetas, sólo Vélez entra
#     en fold). club-boca vive debajo del fold — `scrollUntilVisible` antes.
#   - Conservadora: turno_simple en todas las semanas. Mitad de semanas
#     podría usar descanso intercalado vía `runFlow` no soportado en
#     Maestro 2.x — simplificamos a turno_simple consistente. QA
#     parametrizable para variante 50/50.
#   - `btn-week-option-descanso` NO resuelve partido (sólo recupera fatiga).
#     `btn-week-option-turno_simple` sí lo resuelve.
#   - pos-CAM default; carrera B explícita para que QA pueda parametrizar
#     con pos-CB si quiere defensivo.

appId: com.mgcstudios.copero
name: f33-walk-carrera-b-conservadora
tags:
  - career
  - f3.3
  - walk
  - mgc-1786
  - mgc-1633
  - carrera-b
  - conservadora

---
- launchApp:
    appId: com.mgcstudios.copero
    clearState: true

- assertVisible:
    id: home-screen
- tapOn:
    id: btn-career
    label: "Home → /identity"

- assertVisible:
    id: identity-screen
- scrollUntilVisible:
    element:
      id: input-name
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-name
    text: "Mateo F33B"
- scrollUntilVisible:
    element:
      id: input-lastname
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-lastname
    text: "Conservadora"
- scrollUntilVisible:
    element:
      id: country-ARG
    direction: DOWN
    timeout: 5000
- tapOn:
    id: country-ARG
# Carrera B conservadora: posición CAM (mediocampista central).
- scrollUntilVisible:
    element:
      id: pos-CAM
    direction: DOWN
    timeout: 5000
- tapOn:
    id: pos-CAM
    label: "Posición CAM (mediocampista)"
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-identity-continue
    label: "→ /dashboard"

- assertVisible:
    id: dashboard-screen
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy

- assertVisible:
    id: academy-screen
    label: "Pantalla academy"
# Boca Juniors (arquetipo AMBICIÓN) está debajo del fold.
- scrollUntilVisible:
    element:
      text: "BOCA JUNIORS"
    direction: DOWN
    timeout: 5000
- scrollUntilVisible:
    element:
      id: club-boca
    direction: DOWN
    timeout: 5000
- tapOn:
    id: club-boca
    label: "Pick Boca (arquetipo AMBICIÓN)"
- assertVisible:
    text: "Firmar"
- tapOn:
    text: "Firmar"
- waitForAnimationToEnd

# ── DEBUT MATCH (PR #421 WF4) ────────────────────────────────────────
- assertVisible:
    id: dashboard-screen
- scrollUntilVisible:
    element:
      id: btn-dashboard-academy
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-academy
    label: "Dashboard → /match (debut)"

- assertVisible:
    id: match-screen
- assertVisible:
    id: match-scoreboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: btn-match-finalize
    direction: DOWN
    timeout: 10000
- tapOn:
    id: btn-match-finalize
    label: "Finalizar debut → /post-match"

- assertVisible:
    id: post-match-screen
- scrollUntilVisible:
    element:
      id: btn-post-match-next-week
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-post-match-next-week
    label: "Siguiente semana → /dashboard"

# ── DRAFT → TU-JUGADOR → CLUB final boca ─────────────────────────────
- assertVisible:
    id: dashboard-screen
- scrollUntilVisible:
    element:
      id: btn-dashboard-draft
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-dashboard-draft

- assertVisible:
    id: draft-screen
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-draft-confirm
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-draft-confirm
      - waitForAnimationToEnd

- assertVisible:
    id: tu-jugador-screen
- scrollUntilVisible:
    element:
      id: btn-tu-jugador-club
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-tu-jugador-club
    label: "Tu jugador → /club"

- assertVisible:
    id: club-pick-boca
    label: "Club final Boca"
- tapOn:
    id: club-pick-boca
    label: "Pick Boca (club final)"
- waitForAnimationToEnd

# ── TEMPORADA: 6 temporadas conservadoras (turno_simple) ─────────────
- assertVisible:
    id: temporada-screen
- repeat:
    times: 6
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-play
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-play
          label: "Temporada → /season-hub"
      - assertVisible:
          id: season-hub-scroll
      - scrollUntilVisible:
          element:
            id: btn-season-hub-decide
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-decide
      - assertVisible:
          id: week-decision-scroll
      - scrollUntilVisible:
          element:
            id: btn-week-option-turno_simple
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-week-option-turno_simple
          label: "Pick turno_simple (partido simple)"
      - waitForAnimationToEnd
      - assertVisible:
          id: season-hub-scroll
      - scrollUntilVisible:
          element:
            id: btn-season-hub-view-table
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-view-table
      - waitForAnimationToEnd

# ── FIN-CARRERA: avanzar hasta retiro de edad (8 default) ────────────
- assertVisible:
    id: temporada-screen
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-next-week
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-next-week
      - waitForAnimationToEnd
- assertVisible:
    id: temporada-last-season
- scrollUntilVisible:
    element:
      id: btn-temporada-retire
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-temporada-retire
- waitForAnimationToEnd

# ── FIN-CARRERA ──────────────────────────────────────────────────────
- assertVisible:
    id: fin-carrera-screen
    label: "Pantalla fin-carrera"
# Carrera B puede terminar con retire.summary (larga, llegó a 35) o
# retire.notFinished (corta, motor decidió fin anticipado).
- assertVisible:
    text: "Resumen"
    label: "Resumen de carrera visible"
