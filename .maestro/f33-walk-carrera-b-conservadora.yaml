# MGC-1786 / MGC-1633 — F3.3 Walk carrera-b conservadora (REESCRITO sobre
# a09ffbe / PR #470 UX1).
#
# Carrera larga conservadora: turno_simple + descanso intercalados,
# fatiga baja, fin-carrera tardío (10-15 temporadas). Variante "6 sem
# descanso" del AC: el flow elige `descanso` en week-decision por 6
# semanas para acumular career.fisico + moral neutra sin riesgo de
# lesión. La partida se consume igual (turno_simple en la semana 7).
#
# Precondiciones (ejecutar ANTES de `maestro test`):
#   1. APK pineado al SHA del PR que cerró UX1 (PR #470 a09ffbe) o
#      posterior. testIDs `team-select-card-${id}` y `btn-team-select-continue`
#      sólo existen desde PR #470.
#   2. adb shim en ~/.local/bin/adb (Homebrew adb 1.0.41 cuelga).
#   3. Device físico ZY22G728HN conectado (`adb devices`).
#   4. JAVA_HOME apuntando a openjdk@17:
#        export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   5. AsyncStorage limpio — el flow asume state vacío. Si hay save previo
#      el flow hidrata y este flow no llega a identity. Forzar reset con:
#        adb shell pm clear com.mgcstudios.copero
#
# AC (MGC-1786 AC actualizado):
#   - Carrera B: setup (identity con input-lastname + pos-CAM + club boca)
#     → season-hub → 6 semanas de descanso → 1 turno_simple → fin-carrera
#     forzado. AsyncStorage persistido con stage='retirement'.
#   - Termina en /simulador-carrera/fin-carrera con stage='retirement'.
#
# Diferencias vs MGC-1786 PR #468 (a0354e1 sobre c33b9d2):
#   - PR #468 recorría academy → debut match → /draft → /tu-jugador → /club
#     → /temporada con turno_simple. ESTE FLOW YA NO EXISTE en main.
#   - PR #470 reemplaza academy.tsx y el módulo draft.tsx por team-select.
#     NO hay debut match, NO hay /draft inicial, NO hay /club final.
#   - week-decision.descanso NO consume matchweek (no llama
#     resolveMatchweek). turno_simple consume matchweek vía
#     `weeklyChoice()`. Carrera B hace 6 descansos (sin matchweek) + 1
#     turno_simple (con matchweek) antes del retiro.
#
# Ejecución:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
#   adb shell pm clear com.mgcstudios.copero
#   maestro test .maestro/f33-walk-carrera-b-conservadora.yaml
#
# Owner del device: QA agent (ZY22G728HN). CI no corre Maestro mobile.

appId: com.mgcstudios.copero
name: f33-walk-carrera-b-conservadora
tags:
  - career
  - f3.3
  - walk
  - mgc-1786
  - mgc-1633
  - carrera-b
  - conservadora
  - ux1

---
# ── SETUP: home → identity (4 campos post-PR #427) ───────────────────
- launchApp:
    appId: com.mgcstudios.copero
    clearState: true

- assertVisible:
    id: home-screen
    label: "Home con CTA Jugar visible"
- assertVisible:
    id: btn-career
    label: "CTA Jugar presente"
- tapOn:
    id: btn-career
    label: "Tap Jugar → /identity"

- assertVisible:
    id: identity-screen
    label: "Pantalla identity montada"
- scrollUntilVisible:
    element:
      id: input-name
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-name
    text: "Bruno F33B"
- scrollUntilVisible:
    element:
      id: input-lastname
    direction: DOWN
    timeout: 5000
- inputText:
    id: input-lastname
    text: "Conservadora"
- scrollUntilVisible:
    element:
      id: country-ARG
    direction: DOWN
    timeout: 5000
- tapOn:
    id: country-ARG
    label: "País Argentina"
# Carrera B conservadora: posición CAM (MID central). Chips pos-{id}.
- scrollUntilVisible:
    element:
      id: pos-CAM
    direction: DOWN
    timeout: 5000
- tapOn:
    id: pos-CAM
    label: "Posición CAM (volante central)"
- scrollUntilVisible:
    element:
      id: btn-identity-continue
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-identity-continue
    label: "Continuar → /team-select (PR #470 UX1)"

# ── TEAM-SELECT (PR #470 UX1) ────────────────────────────────────────
- assertVisible:
    id: team-select-screen
    label: "Pantalla team-select montada"
- scrollUntilVisible:
    element:
      id: team-select-card-boca
    direction: DOWN
    timeout: 5000
- tapOn:
    id: team-select-card-boca
    label: "Pick Boca (club inicial)"
- assertVisible:
    id: btn-team-select-continue
    label: "CTA Continuar habilitado tras pick"
- tapOn:
    id: btn-team-select-continue
    label: "Continuar → /season-hub"
- assertVisible:
    id: season-hub-scroll
    timeout: 8000
    label: "Season hub montado tras team-select"

# ── FASE 1: 6 semanas de descanso (AC: 6 sem descanso) ──────────────
# descanso NO consume matchweek (no llama resolveMatchweek). Sólo
# career.fisico +20, moral -2.
- repeat:
    times: 6
    commands:
      - scrollUntilVisible:
          element:
            id: btn-season-hub-decide
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-season-hub-decide
          label: "Season hub → /week-decision"
      - assertVisible:
          id: week-decision-scroll
          timeout: 5000
          label: "Week decision montada"
      - scrollUntilVisible:
          element:
            id: btn-week-option-descanso
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-week-option-descanso
          label: "Pick descanso (recupera +20 fisico)"
      - assertVisible:
          id: season-hub-scroll
          timeout: 8000
          label: "Vuelta a season-hub post-descanso"

# ── FASE 2: 1 turno_simple (consume matchweek, NO navega a /match) ──
- scrollUntilVisible:
    element:
      id: btn-season-hub-decide
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-season-hub-decide
    label: "Season hub → /week-decision"
- assertVisible:
    id: week-decision-scroll
    timeout: 5000
    label: "Week decision montada"
- scrollUntilVisible:
    element:
      id: btn-week-option-turno_simple
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-week-option-turno_simple
    label: "Pick turno_simple (consume partido)"
- assertVisible:
    id: season-hub-scroll
    timeout: 8000
    label: "Vuelta a season-hub post-partido"

# ── TEMPORADA SCREEN: forzar retirement ──────────────────────────────
- scrollUntilVisible:
    element:
      id: btn-season-hub-view-table
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-season-hub-view-table
    label: "Season hub → /temporada"
- assertVisible:
    id: temporada-screen
    timeout: 8000
    label: "Pantalla temporada montada"
# Avanzar 2 semanas para acumular historial antes del retiro.
- repeat:
    times: 2
    commands:
      - scrollUntilVisible:
          element:
            id: btn-temporada-next-week
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: btn-temporada-next-week
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: btn-temporada-retire
    direction: DOWN
    timeout: 5000
- tapOn:
    id: btn-temporada-retire
    label: "Retiro forzado → /fin-carrera"
- waitForAnimationToEnd

# ── FIN-CARRERA ──────────────────────────────────────────────────────
- assertVisible:
    id: fin-carrera-screen
    timeout: 8000
    label: "Pantalla fin-carrera con resumen"
# Carrera B conservadora debería tener retire.notFinished (sólo 7 semanas
# de juego, motor no detecta fin natural). Aceptamos cualquier resumen.
- assertVisible:
    text: "Resumen"
    label: "Resumen de carrera visible"
