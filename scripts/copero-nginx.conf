server {
    listen 80;
    server_name copero.mgcstudios.app;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;        # MGC-538: default nginx 1 -> 403KB transfer en chunk de 1262KB. Level 6 -> 337KB (paridad con prodlike local LH 0.91). Tambien sirve pre-compressed .gz via gzip_static.
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # MGC-538: sirve .gz pre-comprimidos del build (scripts/precompress-assets.mjs)
    # cuando existen en disco. Cada nuevo deploy con content hash fresco en
    # /_expo/static/* busta el cache de Cloudflare (inmutable=1y). Para el
    # bundle vigente hasta el proximo deploy, child MGC-540 solicita al
    # CEO purge de /_expo/static/* en la zona mgcstudios.app.
    gzip_static on;
    gzip_static_types
        application/javascript
        text/css
        application/wasm
        image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Inmutable para bundles con hash (MGC-483: max-age explicito para CDN)
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Edge-cache HTML en CF para cerrar gap LH server-response-time (MGC-490).
    # Cache-Control "public, s-maxage=300" permite que CF edge sirva el
    # HTML cacheado por 5 min. Antes: "no-cache, no-store, must-revalidate"
    # causaba cf-cache-status=DYNAMIC y TTFB 1.4-3.6s vs <100ms via nginx
    # directo. NO agregamos `must-revalidate` ni `Expires: 0` porque
    # Cloudflare los interpreta como "no cachear" en HTML y dispara
    # DYNAMIC. Browser revalida via Last-Modified (nginx emite ETag).
    # PREREQUISITO: la zona mgcstudios.app requiere Cache Rule o Page
    # Rule que habilite cache de HTML (ver ticket child MGC-491); sin
    # eso, cf-cache-status sigue DYNAMIC aunque s-maxage sea canonico.
    location = /index.html {
        add_header Cache-Control "public, s-maxage=300";
    }

    # No-cache para metadata
    location = /metadata.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}