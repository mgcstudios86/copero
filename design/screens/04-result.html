<!doctype html>
<!-- Mockup: ResultScreen — arquetipo ganador, stats, CTA jugar de nuevo. -->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Resultado — Copero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@600;700&display=swap" />
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --text: #16201A;
    --text-muted: #4A5750;
    --primary: #1F6F4A;
    --accent: #C73E2A;
    --focus: #2563EB;
    --winner: #4F46E5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid; place-items: center;
  }
  main { width: min(420px, 92vw); background: var(--surface); border-radius: 20px; padding: 32px 24px; text-align: center; }
  .silhouette {
    width: 160px; height: 160px; margin: 0 auto 16px;
    display: block;
  }
  .badge {
    display: inline-block;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--winner);
    background: rgba(79,70,229,0.10);
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 36px;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .tagline { color: var(--text-muted); font-size: 16px; margin: 0 0 24px; }
  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 24px; }
  dt { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  dd { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; margin: 4px 0 0; color: var(--text); }
  .cta {
    font-family: 'Poppins', sans-serif; font-weight: 600;
    background: var(--primary); color: #fff;
    border: 0; padding: 14px 32px; border-radius: 12px;
    font-size: 16px; min-height: 44px; cursor: pointer;
  }
  .cta:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
  <main role="main" aria-labelledby="result-title">
    <svg class="silhouette" viewBox="0 0 240 240" role="img" aria-label="Silueta del arquetipo Filosofo">
      <title>Filosofo</title>
      <rect width="240" height="240" rx="24" fill="#4F46E5" fill-opacity="0.12"/>
      <circle cx="120" cy="92" r="40" fill="#4F46E5"/>
      <path d="M40 220 C 40 162, 80 140, 120 140 C 160 140, 200 162, 200 220 Z" fill="#4F46E5"/>
    </svg>
    <span class="badge">Arquetipo ganador</span>
    <h1 id="result-title">Filosofo</h1>
    <p class="tagline">Pregunta el por que.</p>
    <dl aria-label="Estadisticas finales">
      <div><dt>Aciertos</dt><dd>8</dd></div>
      <div><dt>Errores</dt><dd>2</dd></div>
      <div><dt>Tiempo medio</dt><dd>12s</dd></div>
      <div><dt>Puntaje</dt><dd>820</dd></div>
    </dl>
    <button type="button" class="cta">Volver a jugar</button>
  </main>
</body>
</html>
