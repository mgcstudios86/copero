<!doctype html>
<!-- Mockup: Splash — Inter/Poppins, paleta arquetipos, focus visible, role/aria. -->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Splash — Copero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@600;700&display=swap" />
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --text: #16201A;
    --text-muted: #4A5750;
    --primary: #1F6F4A;
    --accent: #C73E2A;
    --focus: #2563EB;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
  }
  main {
    width: min(420px, 92vw);
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 48px 24px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(22, 32, 26, 0.08);
  }
  .logo {
    width: 96px; height: 96px; border-radius: 24px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: grid; place-items: center;
    color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 36px;
    margin: 0 auto 24px;
  }
  h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 32px;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 32px;
  }
  button {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 32px;
    border: 0;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    min-height: 44px;
    min-width: 44px;
  }
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <main role="main" aria-labelledby="splash-title">
    <div class="logo" aria-hidden="true">C</div>
    <h1 id="splash-title">Copero</h1>
    <p>Juego de palabras en equipo. Sin servidor. Sin login.</p>
    <button type="button" aria-label="Iniciar partida nueva">Jugar</button>
  </main>
</body>
</html>
