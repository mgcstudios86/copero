<!doctype html>
<!-- Mockup: ProgressBar — ronda 3 de 10, timer 30s, barra accesible. -->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Progreso — Copero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@600;700&display=swap" />
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --text: #16201A;
    --text-muted: #4A5750;
    --primary: #1F6F4A;
    --accent: #C73E2A;
    --focus: #2563EB;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid; place-items: center;
  }
  main { width: min(420px, 92vw); background: var(--surface); border-radius: 20px; padding: 24px; }
  h1 { font-family: 'Poppins', sans-serif; font-size: 18px; margin: 0 0 12px; }
  p { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  [role="progressbar"] {
    appearance: none; -webkit-appearance: none;
    width: 100%; height: 12px; border: 0; border-radius: 999px;
    background: #ECE6DA; overflow: hidden;
  }
  [role="progressbar"]::-webkit-progress-bar { background: #ECE6DA; border-radius: 999px; }
  [role="progressbar"]::-webkit-progress-value { background: var(--primary); border-radius: 999px; }
  [role="progressbar"]::-moz-progress-bar { background: var(--primary); border-radius: 999px; }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--text-muted); }
  .timer { font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--accent); }
  .round { font-family: 'Poppins', sans-serif; font-weight: 600; color: var(--primary); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
  <main role="main" aria-labelledby="prog-title">
    <h1 id="prog-title">Progreso de la ronda</h1>
    <p>Completa las 10 rondas antes de que el tiempo se agote.</p>
    <div
      role="progressbar"
      aria-valuenow="3"
      aria-valuemin="0"
      aria-valuemax="10"
      aria-valuetext="Ronda 3 de 10"
      tabindex="0">
    </div>
    <div class="meta">
      <span class="round">Ronda 3 / 10</span>
      <span class="timer">00:30</span>
    </div>
    <span class="sr-only">Progreso: 30 por ciento de la ronda completada.</span>
  </main>
</body>
</html>
